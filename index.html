    <style>
        /* === カラーパレット定義 === */
        :root {
            --bg-primary: #f8fafc; /* メイン背景 */
            --bg-secondary: #ffffff; /* カード背景 */
            --bg-accent: #f1f5f9; /* アクセント背景 */
            --text-primary: #1e293b; /* メインテキスト */
            --text-secondary: #64748b; /* サブテキスト */
            --border-color: #e2e8f0; /* 境界線 */
            --primary-brand: #4f46e5; /* プライマリブランドカラー */
            --primary-brand-hover: #4338ca;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
        }
        
        /* === 基本スタイル === */
        body { 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            background-color: var(--bg-primary); 
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        /* === 共通コンポーネント === */
        .card {
            background-color: var(--bg-secondary);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .main-view, .modal-content {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }
        h1, h2, h3 { color: var(--text-primary); }
        input, select {
            background-color: var(--bg-secondary);
            border-color: var(--border-color);
            color: var(--text-primary);
            border-radius: 0.5rem;
        }
        input:focus, select:focus {
            border-color: var(--primary-brand);
            box-shadow: 0 0 0 2px var(--primary-brand-hover);
            outline: none;
        }
        .input-success {
            border-color: #22c55e !important; /* green-500 */
            transition: border-color 0.5s;
        }


        /* === ナビゲーションボタン === */
        .nav-button {
            transition: all 0.2s ease-in-out;
        }
        .nav-button.active {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        /* === カレンダー === */
        .calendar-day { 
            border: 1px solid var(--border-color);
            min-height: 100px; position: relative;
            background-color: var(--bg-secondary);
            border-radius: 0.375rem; cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .calendar-day:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .calendar-day-header { font-weight: 500; color: var(--text-secondary); }
        .today { background-color: #fef2f2; }
        .today .calendar-day-header { color: #dc2626; font-weight: 700; }
        .other-month { background-color: var(--bg-accent); color: var(--text-secondary); cursor: default; }
        .other-month:hover { transform: none; box-shadow: none; }
        
        /* === モーダル === */
        .modal { background-color: rgba(0,0,0,0.6); }

        /* === 一括シフトテーブル === */
        .bulk-shift-table th, .bulk-shift-table td { border: 1px solid var(--border-color); }
        .bulk-shift-table thead th { background-color: var(--bg-accent); position: sticky; top: 0; z-index: 20;}
        .bulk-shift-table tbody th { background-color: var(--bg-accent); position: sticky; left: 0; z-index: 10;}
        .bulk-shift-table thead th:first-child { left: 0; z-index: 30; }
        .bulk-shift-table tfoot th { background-color: var(--bg-accent); position: sticky; left: 0; z-index: 10;}
        .bulk-shift-table input[type="text"] { border: none; }
        
        /* スマホ対応の一括シフトテーブル */
        @media (max-width: 768px) {
            .bulk-shift-table {
                font-size: 0.7rem;
            }
            .bulk-shift-table th, .bulk-shift-table td {
                padding: 0.2rem;
                min-width: 100px;
            }
            .bulk-shift-table input[type="text"] {
                font-size: 1rem; /* 16px以上にしてズームを防ぐ */
                padding: 0.2rem;
                min-width: 95px;
            }
            .bulk-shift-table tbody th {
                min-width: 110px;
                font-size: 0.7rem;
            }
        }
        
        /* タブレット対応 */
        @media (max-width: 1024px) and (min-width: 769px) {
            .bulk-shift-table {
                font-size: 0.8rem;
            }
            .bulk-shift-table th, .bulk-shift-table td {
                padding: 0.3rem;
                min-width: 120px;
            }
            .bulk-shift-table input[type="text"] {
                font-size: 1rem; /* 16px以上にしてズームを防ぐ */
                padding: 0.3rem;
                min-width: 115px;
            }
        }
        
        /* デスクトップ対応 */
        @media (min-width: 1025px) {
            .bulk-shift-table th, .bulk-shift-table td {
                min-width: 140px;
            }
            .bulk-shift-table input[type="text"] {
                min-width: 135px;
            }
            .bulk-shift-table tbody th {
                min-width: 150px;
            }
        }
    </style>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', function() {


        // --- ログイン機能 ---
        const credentials = { manager: { password: 'pass123', role: 'manager' }, user: { password: 'pass123', role: 'employee' } };
        const staticUsersForLogin = [{ id: 1, name: '管理者', role: 'manager' }];
        let currentUser = null; 
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const loginIdInput = document.getElementById('loginId');
        const loginPasswordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');
        
        function handleLogin() {
            const id = loginIdInput.value.toLowerCase();
            const password = loginPasswordInput.value;
            const userCredential = credentials[id];
            if (userCredential && userCredential.password === password) {
                loginError.textContent = '';
                loginScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');
                currentUser = (userCredential.role === 'manager') ? staticUsersForLogin[0] : { id: 0, name: '従業員', role: 'employee_viewer' };
                initializeApp();
            } else { loginError.textContent = 'IDまたはパスワードが正しくありません。'; }
        }
        function handleLogout() {
            currentUser = null; appContainer.classList.add('hidden'); loginScreen.classList.remove('hidden');
            loginPasswordInput.value = ''; location.reload(); 
        }
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        loginPasswordInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleLogin(); });

        // --- アプリケーション初期化 ---
        function initializeApp() {
            const API_BASE_URL = 'https://my-shift-backend.tamago-2483.workers.dev'; 
            let dailyShiftChartInstance = null;
            let appState = { users: [], shifts: {}, manualBreaks: {}, manualShortages: {} };
            let loadedMonths = {};

            const mainViews = { 
                calendar: document.getElementById('calendarView'), 
                dailyChart: document.getElementById('dailyChartView'), 
                bulkShift: document.getElementById('bulkShiftView') 
            };
            
            mainViews.calendar.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                    <h2 class="text-2xl font-semibold mb-2 md:mb-0">イベント・個人シフト</h2>
                    <div class="flex items-center gap-2">
                        <label for="employeeHighlightSelect" class="text-sm font-medium">従業員ハイライト:</label>
                        <select id="employeeHighlightSelect" class="p-2 border rounded-md shadow-sm text-sm"></select>
                    </div>
                    <div class="flex items-center">
                        <button id="prevMonthBtn" class="bg-slate-200 hover:bg-slate-300 font-bold py-2 px-4 rounded-lg transition"><i class="fas fa-angle-left mr-1"></i>前月</button>
                        <h3 id="calendarMonthYear" class="text-xl font-semibold w-40 text-center mx-2"></h3>
                        <button id="nextMonthBtn" class="bg-slate-200 hover:bg-slate-300 font-bold py-2 px-4 rounded-lg transition">次月<i class="fas fa-angle-right ml-1"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 gap-2 text-center font-semibold mb-2 text-sm">
                    <div class="text-red-600">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-600">土</div>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>`;

            mainViews.dailyChart.innerHTML = `
                <h2 class="text-2xl font-semibold mb-4">日別シフトグラフ</h2>
                <div class="flex items-center mb-4">
                    <button id="prevDayChartBtn" class="bg-slate-200 hover:bg-slate-300 font-bold py-2 px-4 rounded-l-lg transition"><i class="fas fa-chevron-left"></i></button>
                    <input type="date" id="currentChartDate" class="p-2 text-center border-y border-slate-300 w-full text-lg">
                    <button id="nextDayChartBtn" class="bg-slate-200 hover:bg-slate-300 font-bold py-2 px-4 rounded-r-lg transition"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="chart-container mb-6" style="height: 400px;"><canvas id="dailyShiftChart"></canvas></div>`;

            mainViews.bulkShift.innerHTML = `
                <h2 class="text-2xl font-semibold mb-4">一括シフト表示・作成</h2>
                <div class="flex flex-col sm:flex-row items-center justify-between mb-4 gap-4">
                    <div class="flex items-center">
                        <button id="prevMonthBulkBtn" class="bg-slate-200 hover:bg-slate-300 font-bold py-2 px-3 rounded-l-lg transition"><i class="fas fa-angle-double-left"></i>前月</button>
                        <span id="bulkShiftMonthYear" class="font-semibold text-lg mx-4"></span>
                        <button id="nextMonthBulkBtn" class="bg-slate-200 hover:bg-slate-300 font-bold py-2 px-3 rounded-r-lg transition">次月<i class="fas fa-angle-double-right"></i></button>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-sm">表示範囲:</span>
                        <button id="toggleBulkShiftPeriodBtn" class="bg-sky-500 hover:bg-sky-600 text-white text-sm py-2 px-3 rounded-lg transition">前半 (1-15日)</button>
                    </div>
                </div>
                <div class="overflow-x-auto" style="max-width: 100vw;">
                    <div class="inline-block min-w-full">
                        <div class="text-xs text-slate-500 mb-2">ヒント: セル選択中に貼り付け(Excel/Googleスプレッドシート対応)、矢印キー/Enterで移動、入力は「930-1830」「9:30-18:30」「9-18」などもOKです。</div>
                        <table id="bulkShiftTable" class="min-w-full border-collapse border bulk-shift-table">
                            <thead><tr id="bulkShiftTableDateHeader"></tr></thead>
                            <tbody id="bulkShiftTableBody"></tbody>
                            <tfoot>
                                <tr id="bulkShiftTableBreakTimesRow"></tr>
                                <tr id="bulkShiftTableShortageHoursRow"></tr>
                            </tfoot>
                        </table>
                    </div>
                </div>`;

            const navButtons = { calendar: document.getElementById('showCalendarViewBtn'), dailyChart: document.getElementById('showDailyChartViewBtn'), bulkShift: document.getElementById('showBulkShiftViewBtn') };
            const shiftDetailModal = document.getElementById('shiftDetailModal');
            const modalContent = document.getElementById('modalContent');
            const currentUserInfo = document.getElementById('currentUserInfo');
            document.getElementById('currentYear').textContent = new Date().getFullYear();
            
            const today = new Date();
            let calendarDisplayDate = new Date(today.getFullYear(), today.getMonth(), 1);
            let chartDisplayDate = new Date();
            let bulkViewDisplayMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            // リアルタイムの日付を取得して、その日が含まれる範囲を初めに表示
            let bulkViewIsFirstHalf = today.getDate() <= 15;
            let selectedEmployeeForHighlight = null;
            
            // --- Helper Functions ---
            function formatTime(d) { return `${('0' + d.getHours()).slice(-2)}:${('0' + d.getMinutes()).slice(-2)}`; }
            function formatDate(d) { return `${d.getFullYear()}-${('0' + (d.getMonth() + 1)).slice(-2)}-${('0' + d.getDate()).slice(-2)}`; }
            function formatDateToJapanese(d) { return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 (${['日','月','火','水','木','金','土'][d.getDay()]})`; }
            function formatDateToJapaneseShort(d) { return `${d.getMonth() + 1}/${d.getDate()}(${['日','月','火','水','木','金','土'][d.getDay()]})`;}
            function isToday(d) { return d.toDateString() === new Date().toDateString(); }
            function parseTimeToDate(t, b) {
                if (!t || !t.includes(':')) return null;
                const [h, m] = t.split(':').map(Number);
                const d = new Date(b);
                d.setHours(h, m, 0, 0);
                return d;
            }
            function isValidShiftTimeFormat(str) {
                if (!str) return true;
                return /^\d{2}:\d{2}\s*-\s*\d{2}:\d{2}$/.test(str.trim());
            }
            function normalizeShiftTimeInput(raw) {
                if (!raw) return '';
                let value = raw.trim();
                value = value.replace(/[〜~－ー–—]/g, '-');
                const parts = value.split('-').map(s => s.trim()).filter(Boolean);
                if (parts.length !== 2) return raw.trim();
                const normalizePart = (p) => {
                    if (p === '') return null;
                    const digits = p.replace(/[^0-9:]/g, '');
                    if (!digits) return null;
                    if (digits.includes(':')) {
                        const [hStr, mStr = '00'] = digits.split(':');
                        let h = parseInt(hStr, 10);
                        let m = parseInt(mStr, 10);
                        if (isNaN(h) || h < 0 || h > 23) return null;
                        if (isNaN(m) || m < 0 || m > 59) m = 0;
                        return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                    } else {
                        const num = digits;
                        if (num.length <= 2) {
                            const h = parseInt(num, 10);
                            if (isNaN(h) || h < 0 || h > 23) return null;
                            return `${('0' + h).slice(-2)}:00`;
                        } else if (num.length === 3) {
                            const h = parseInt(num.slice(0, 1), 10);
                            const m = parseInt(num.slice(1), 10);
                            if (isNaN(h) || h < 0 || h > 23 || isNaN(m) || m < 0 || m > 59) return null;
                            return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                        } else {
                            const h = parseInt(num.slice(0, 2), 10);
                            const m = parseInt(num.slice(2, 4), 10);
                            if (isNaN(h) || h < 0 || h > 23 || isNaN(m) || m < 0 || m > 59) return null;
                            return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                        }
                    }
                };
                const start = normalizePart(parts[0]);
                const end = normalizePart(parts[1]);
                if (!start || !end) return raw.trim();
                return `${start} - ${end}`;
            }
            
            // --- Data Fetching & State ---
            async function fetchDataForMonth(date) {
                const year = date.getFullYear();
                const month = ('0' + (date.getMonth() + 1)).slice(-2);
                const monthKey = `${year}-${month}`;
                
                if (!loadedMonths[monthKey]) {
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/data?month=${year}-${month}`);
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        
                        appState.users = data.users || [];
                        appState.shifts = { ...appState.shifts, ...data.shifts };
                        appState.manualBreaks = { ...appState.manualBreaks, ...data.manualBreaks };
                        appState.manualShortages = { ...appState.manualShortages, ...data.manualShortages };
                        
                        loadedMonths[monthKey] = true;
                    } catch (error) {
                        console.error("データ取得エラー:", error);
                        alert("APIサーバーへの接続に失敗しました。");
                        return;
                    }
                }
                
                updateUserInfo();
                refreshCurrentView();
            }
            
            // --- 一括入力の変更を保存する関数 ---
            async function updateShift(shiftData) {
                try {
                    console.log('シフト更新リクエスト:', shiftData);
                    
                    // データの検証
                    if (!shiftData.userId || !shiftData.date) {
                        console.error('必須データが不足:', shiftData);
                        throw new Error('必須データが不足しています');
                    }
                    
                    const response = await fetch(`${API_BASE_URL}/api/update-shift`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(shiftData)
                    });
                    
                    console.log('APIレスポンス:', response.status, response.statusText);
                    
                    if (!response.ok) {
                        const errorBody = await response.text();
                        console.error('APIエラーレスポンス:', errorBody);
                        throw new Error(`APIエラー (ステータス: ${response.status}): ${errorBody}`);
                    }
                    
                    const result = await response.json();
                    console.log('API成功レスポンス:', result);
                    
                    // ローカル状態を更新
                    if (!appState.shifts[shiftData.date]) {
                        appState.shifts[shiftData.date] = [];
                    }
                    
                    let existingShift = appState.shifts[shiftData.date].find(s => s.userId === shiftData.userId);
                    if (shiftData.time && shiftData.time.trim()) {
                        if (existingShift) {
                            existingShift.time = shiftData.time;
                        } else {
                            const user = appState.users.find(u => u.id === shiftData.userId);
                            appState.shifts[shiftData.date].push({
                                userId: shiftData.userId, 
                                time: shiftData.time,
                                fullName: user ? user.name : 'Unknown', 
                                role: user ? user.role : 'employee'
                            });
                        }
                    } else {
                        // 空の場合は削除
                        appState.shifts[shiftData.date] = appState.shifts[shiftData.date].filter(s => s.userId !== shiftData.userId);
                    }
                    
                    console.log('ローカル状態更新完了:', appState.shifts[shiftData.date]);
                    return true;
                } catch (error) {
                    console.error("シフトの更新に失敗しました:", error);
                    alert(`シフトの更新に失敗しました。\n\nエラー内容: ${error.message}`);
                    return false;
                }
            }
            
            async function updateManualData(date, breaks, shortages) {
                try {
                    console.log('手動データ更新リクエスト:', { date, breaks, shortages });
                    
                    // データの検証
                    if (!date) {
                        console.error('日付が不足:', { date, breaks, shortages });
                        throw new Error('日付が不足しています');
                    }
                    
                    const response = await fetch(`${API_BASE_URL}/api/update-manual-data`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ date, breaks, shortages })
                    });
                    
                    console.log('APIレスポンス:', response.status, response.statusText);
                    
                    if (!response.ok) {
                        const errorBody = await response.text();
                        console.error('APIエラーレスポンス:', errorBody);
                        throw new Error(`APIエラー (ステータス: ${response.status}): ${errorBody}`);
                    }
                    
                    const result = await response.json();
                    console.log('API成功レスポンス:', result);
                    
                    // ローカル状態を更新
                    appState.manualBreaks[date] = breaks;
                    appState.manualShortages[date] = shortages;
                    
                    console.log('ローカル状態更新完了:', { breaks: appState.manualBreaks[date], shortages: appState.manualShortages[date] });
                    return true;
                } catch (error) {
                    console.error("手動データの更新に失敗しました:", error);
                    alert(`休憩・不足時間の更新に失敗しました。\n\nエラー内容: ${error.message}`);
                    return false;
                }
            }
            
            async function handleBulkShiftChange(event) {
                const input = event.target;
                if (!input.matches('input[type="text"]')) return;

                // オートフォーマット & バリデーション（シフトセルのみ）
                if (input.matches('.bulk-cell')) {
                    const normalized = normalizeShiftTimeInput(input.value);
                    if (normalized !== input.value) input.value = normalized;
                    if (!isValidShiftTimeFormat(input.value) && input.value.trim() !== '') {
                        input.style.outline = '2px solid #ef4444';
                        return;
                    } else {
                        input.style.outline = '';
                    }
                }

                const date = input.dataset.date;
                let success = false;
                
                if (input.matches('input[data-user-id]')) {
                    const userId = parseInt(input.dataset.userId, 10);
                    const time = input.value.trim();
                    success = await updateShift({ userId, date, time });
                } else if (input.matches('.break-time-input') || input.matches('.shortage-input')) {
                    const breakInput = mainViews.bulkShift.querySelector(`.break-time-input[data-date="${date}"]`);
                    const shortageInput = mainViews.bulkShift.querySelector(`.shortage-input[data-date="${date}"]`);
                    const breaks = breakInput ? breakInput.value.trim() : '';
                    const shortages = shortageInput ? shortageInput.value.trim() : '';
                    success = await updateManualData(date, breaks, shortages);
                }
                
                if(success) {
                    input.classList.add('input-success');
                    setTimeout(() => { input.classList.remove('input-success'); }, 800);
                } else {
                    refreshCurrentView();
                }
            }

            function setupBulkTableA11yFocus() {
                const inputs = Array.from(mainViews.bulkShift.querySelectorAll('.bulk-cell, .break-time-input, .shortage-input'));
                inputs.forEach(inp => inp.setAttribute('tabindex', '0'));
            }

            function focusNextCell(current, dx, dy) {
                const allRows = Array.from(document.querySelectorAll('#bulkShiftTable tbody tr'));
                if (allRows.length === 0) return;
                const bodyInputs = Array.from(document.querySelectorAll('#bulkShiftTable tbody input.bulk-cell'));
                const colsPerRow = bodyInputs.length / allRows.length;
                const index = bodyInputs.indexOf(current);
                if (index < 0) return;
                const row = Math.floor(index / colsPerRow);
                const col = index % colsPerRow;
                let newRow = Math.max(0, Math.min(allRows.length - 1, row + dy));
                let newCol = Math.max(0, Math.min(colsPerRow - 1, col + dx));
                const newIndex = newRow * colsPerRow + newCol;
                const target = bodyInputs[newIndex];
                if (target) target.focus();
            }

            function handleBulkShiftKeyNavigation(e) {
                const input = e.target;
                if (!input.matches('input.bulk-cell')) return;
                if (e.key === 'ArrowRight') { e.preventDefault(); focusNextCell(input, 1, 0); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); focusNextCell(input, -1, 0); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); focusNextCell(input, 0, 1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); focusNextCell(input, 0, -1); }
                else if (e.key === 'Enter') { e.preventDefault(); focusNextCell(input, 0, 1); }
            }

            async function handleBulkShiftPaste(e) {
                const active = document.activeElement;
                if (!active || !active.matches('input.bulk-cell')) return;
                const clipboardData = e.clipboardData || window.clipboardData;
                if (!clipboardData) return;
                const text = clipboardData.getData('text');
                if (!text) return;
                const rows = text.split(/\r?\n/).filter(r => r.trim() !== '');
                if (rows.length === 0) return;
                e.preventDefault();
                const tableBodyInputs = Array.from(document.querySelectorAll('#bulkShiftTable tbody input.bulk-cell'));
                const totalRows = document.querySelectorAll('#bulkShiftTable tbody tr').length;
                const colsPerRow = tableBodyInputs.length / totalRows;
                const startIndex = tableBodyInputs.indexOf(active);
                if (startIndex < 0) return;
                let cursorIndex = startIndex;
                for (let r = 0; r < rows.length; r++) {
                    const cells = rows[r].split(/\t/);
                    for (let c = 0; c < cells.length; c++) {
                        const target = tableBodyInputs[cursorIndex + c];
                        if (!target) break;
                        const normalized = normalizeShiftTimeInput(cells[c]);
                        target.value = normalized;
                        target.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                    cursorIndex += colsPerRow;
                }
            }

            // --- UI/View Management ---
            function updateUserInfo() { currentUserInfo.innerHTML = `ログイン中: <span class="font-bold">${currentUser.name}</span>`; }
            
            function setActiveNavButton(activeViewKey) {
                Object.keys(navButtons).forEach(key => {
                    navButtons[key].classList.remove('active');
                    if (key === activeViewKey) navButtons[key].classList.add('active');
                });
            }

            async function switchView(viewKey) {
                Object.keys(mainViews).forEach(key => mainViews[key].classList.toggle('hidden', key !== viewKey));
                setActiveNavButton(viewKey);
                let targetDate;
                if (viewKey === 'calendar') targetDate = calendarDisplayDate;
                else if (viewKey === 'dailyChart') targetDate = chartDisplayDate;
                else if (viewKey === 'bulkShift') targetDate = bulkViewDisplayMonth;
                await fetchDataForMonth(targetDate);
            }
            
            function refreshCurrentView() {
                if (!mainViews.calendar.classList.contains('hidden')) renderCalendar();
                else if (!mainViews.dailyChart.classList.contains('hidden')) renderDailyShiftChart();
                else if (!mainViews.bulkShift.classList.contains('hidden')) renderBulkShiftTable();
            }

            function renderCalendar() {
                const calendarGrid = document.getElementById('calendarGrid');
                if (!calendarGrid) return; 
                calendarGrid.innerHTML = '';
                const year = calendarDisplayDate.getFullYear();
                const month = calendarDisplayDate.getMonth();
                document.getElementById('calendarMonthYear').textContent = `${year}年 ${month + 1}月`;
                
                const employeeHighlightSelect = document.getElementById('employeeHighlightSelect');
                employeeHighlightSelect.innerHTML = `<option value="">全員表示</option>` + appState.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
                if (selectedEmployeeForHighlight) employeeHighlightSelect.value = selectedEmployeeForHighlight;

                const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
                const startDayOfWeek = new Date(year, month, 1).getDay();

                for (let i = 0; i < startDayOfWeek; i++) { calendarGrid.insertAdjacentHTML('beforeend', `<div class="other-month"></div>`); }

                for (let day = 1; day <= lastDayOfMonth; day++) {
                    const date = new Date(year, month, day);
                    const dateString = formatDate(date);
                    const dayCell = document.createElement('div');
                    dayCell.className = 'calendar-day p-2';
                    if(isToday(date)) dayCell.classList.add('today');

                    const shiftsForDay = appState.shifts[dateString] || [];
                    if (selectedEmployeeForHighlight && shiftsForDay.some(s => s.userId == selectedEmployeeForHighlight)) {
                        dayCell.classList.add('bg-indigo-100');
                    }
                    
                    dayCell.innerHTML = `<div class="calendar-day-header text-sm">${day}</div>`;
                    dayCell.addEventListener('click', () => showShiftDetailModal(date));
                    calendarGrid.appendChild(dayCell);
                }
            }
            
            function renderDailyShiftChart() {
                const dailyShiftChartCanvas = document.getElementById('dailyShiftChart');
                if (!dailyShiftChartCanvas) return;
                const dateString = formatDate(chartDisplayDate);
                const shiftsForDay = (appState.shifts[dateString] || []).slice();
                
                if (dailyShiftChartInstance) dailyShiftChartInstance.destroy();
                const ctx = dailyShiftChartCanvas.getContext('2d');
                ctx.clearRect(0, 0, dailyShiftChartCanvas.width, dailyShiftChartCanvas.height);
                
                if (shiftsForDay.length === 0) {
                    ctx.font = '16px Inter, sans-serif'; ctx.fillStyle = '#64748b'; ctx.textAlign = 'center';
                    ctx.fillText('この日のシフトはありません', dailyShiftChartCanvas.width / 2, 50);
                    return;
                }
                
                const sortedShifts = shiftsForDay
                    .filter(s => s && s.time && s.time.includes(' - '))
                    .sort((a, b) => {
                        const [aStartStr, aEndStr] = a.time.split(' - ');
                        const [bStartStr, bEndStr] = b.time.split(' - ');
                        const timeA_start = parseTimeToDate(aStartStr, chartDisplayDate);
                        const timeB_start = parseTimeToDate(bStartStr, chartDisplayDate);
                        const timeA_end = parseTimeToDate(aEndStr, chartDisplayDate);
                        const timeB_end = parseTimeToDate(bEndStr, chartDisplayDate);
                        
                        if (!timeA_start || !timeB_start) return 0;
                        
                        // まず出勤時間で比較
                        const startTimeDiff = timeA_start - timeB_start;
                        if (startTimeDiff !== 0) {
                            return startTimeDiff;
                        }
                        
                        // 出勤時間が同じ場合は退勤時間で比較
                        if (!timeA_end || !timeB_end) return 0;
                        return timeA_end - timeB_end;
                    });

                const yLabels = sortedShifts.map(s => s.fullName);

                const chartDatasetData = sortedShifts.map(shift => {
                    const [startStr, endStr] = shift.time.split(' - ');
                    const mainStartDate = parseTimeToDate(startStr, chartDisplayDate);
                    const mainEndDate = parseTimeToDate(endStr, chartDisplayDate);
                    if(!mainStartDate || !mainEndDate) return null;
                    return {
                        x: [mainStartDate.getTime(), mainEndDate.getTime()], y: shift.fullName, originalShift: shift,
                        bgColor: shift.role === 'manager' ? 'rgba(250, 204, 21, 0.7)' : 'rgba(59, 130, 246, 0.7)'
                    };
                }).filter(Boolean);
                
                const chartMinTime = new Date(chartDisplayDate); chartMinTime.setHours(9,0,0,0); 
                const chartMaxTime = new Date(chartDisplayDate); chartMaxTime.setHours(21,0,0,0); 

                dailyShiftChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: yLabels, datasets: [{ label: '勤務時間', data: chartDatasetData, backgroundColor: chartDatasetData.map(d => d.bgColor) }] },
                    options: {
                        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                        scales: {
                            x: { 
                                type: 'time', min: chartMinTime.getTime(), max: chartMaxTime.getTime(),
                                time: { unit: 'hour', displayFormats: { hour: 'HH:mm' } },
                                ticks: { stepSize: 1 }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const start = new Date(context.raw.x[0]);
                                        const end = new Date(context.raw.x[1]);
                                        return `${context.raw.originalShift.fullName}: ${formatTime(start)} - ${formatTime(end)}`;
                                    }
                                }
                            }
                        }
                    }
                });
            }
            
            function renderBulkShiftTable() {
                const dateHeader = document.getElementById('bulkShiftTableDateHeader');
                const body = document.getElementById('bulkShiftTableBody');
                const breakRow = document.getElementById('bulkShiftTableBreakTimesRow');
                const shortageRow = document.getElementById('bulkShiftTableShortageHoursRow');
                if(!dateHeader || !body || !breakRow || !shortageRow) return;

                setupBulkTableA11yFocus();

                dateHeader.innerHTML = ''; body.innerHTML = ''; breakRow.innerHTML = ''; shortageRow.innerHTML = ''; 

                const days = [];
                let headerHtml = '<th>従業員名</th>';
                const year = bulkViewDisplayMonth.getFullYear();
                const month = bulkViewDisplayMonth.getMonth();
                const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
                const startDay = bulkViewIsFirstHalf ? 1 : 16;
                const endDayLoop = bulkViewIsFirstHalf ? 15 : lastDayOfMonth;

                for (let day = startDay; day <= endDayLoop; day++) {
                    if (day > lastDayOfMonth) break; 
                    const currentDate = new Date(year, month, day);
                    days.push(formatDate(currentDate));
                    headerHtml += `<th class="p-2 text-sm font-medium whitespace-nowrap">${formatDateToJapaneseShort(currentDate)}</th>`;
                }
                dateHeader.innerHTML = headerHtml;
                
                const displayableUsers = [...appState.users];
                displayableUsers.forEach(user => {
                    let rowHtml = `<tr><th class="font-semibold p-2 text-left whitespace-nowrap ${user.role === 'manager' ? 'text-amber-700' : ''}">${user.name}</th>`;
                    days.forEach((dateString) => {
                        const shift = (appState.shifts[dateString] || []).find(s => s.userId === user.id);
                        rowHtml += `<td class="p-0"><input type="text" value="${shift && shift.time && shift.time.trim() ? shift.time : ""}" data-user-id="${user.id}" data-date="${dateString}" class="bulk-cell w-full h-full p-2 bg-transparent border-t-0 border-b-0 border-l-0 border-r text-center" style="border-color: var(--border-color); font-size: 1rem;" placeholder=" " inputmode="numeric" autocomplete="off"></td>`;
                    });
                    rowHtml += '</tr>';
                    body.innerHTML += rowHtml;
                });
                
                let breakTimesRowHtml = '<tr><th class="font-semibold p-2 text-left">休憩</th>'; 
                days.forEach(dateString => {
                    const breakValue = appState.manualBreaks[dateString];
                    breakTimesRowHtml += `<td class="p-0"><input type="text" class="break-time-input w-full h-full p-2 bg-transparent border-t-0 border-b-0 border-l-0 border-r text-center" value="${breakValue && breakValue.trim() ? breakValue : ''}" data-date="${dateString}" style="border-color: var(--border-color); font-size: 1rem;" placeholder=" "></td>`;
                });
                breakRow.innerHTML = breakTimesRowHtml;

                let shortageRowHtml = '<tr><th class="font-semibold p-2 text-left">不足</th>'; 
                days.forEach(dateString => {
                    const shortageValue = appState.manualShortages[dateString];
                    shortageRowHtml += `<td class="p-0"><input type="text" class="shortage-input w-full h-full p-2 bg-transparent border-t-0 border-b-0 border-l-0 border-r text-center" value="${shortageValue && shortageValue.trim() ? shortageValue : ''}" data-date="${dateString}" style="border-color: var(--border-color); font-size: 1rem;" placeholder=" "></td>`;
                });
                shortageRow.innerHTML = shortageRowHtml;

                document.getElementById('bulkShiftMonthYear').textContent = `${year}年 ${month + 1}月`;
                document.getElementById('toggleBulkShiftPeriodBtn').textContent = bulkViewIsFirstHalf ? '前半 (1-15日)' : `後半 (16-${lastDayOfMonth}日)`;

                // 新規要素へフォーカス可能属性を付与
                setupBulkTableA11yFocus();
            }
            
            function showShiftDetailModal(date) {
                const dateString = formatDate(date);
                modalContent.innerHTML = ''; 
                const shiftsForDay = appState.shifts[dateString] || [];
                
                let contentHtml = `
                    <div class="flex justify-between items-center mb-4 pb-4 border-b" style="border-color: var(--border-color);">
                        <h3 class="text-xl font-bold">${formatDateToJapanese(date)}</h3>
                        <button id="closeModalBtn" class="text-2xl hover:text-red-500 transition-colors">&times;</button>
                    </div>
                    <ul class="space-y-2 max-h-80 overflow-y-auto">
                `;

                if (shiftsForDay.length > 0) {
                    shiftsForDay.forEach(shift => {
                        const user = appState.users.find(u => u.id === shift.userId) || { name: '不明' };
                        contentHtml += `<li class="p-3 rounded-md" style="background-color: var(--bg-accent);"><span class="font-bold">${user.name}</span>: ${shift.time}</li>`;
                    });
                } else {
                    contentHtml += `<li>この日のシフト情報はありません。</li>`;
                }

                contentHtml += `</ul>`;
                modalContent.innerHTML = contentHtml;
                shiftDetailModal.classList.remove('hidden');
                
                document.getElementById('closeModalBtn').addEventListener('click', () => {
                    shiftDetailModal.classList.add('hidden');
                });
            }
            
            // --- イベントリスナー設定 ---
            updateUserInfo();
            Object.keys(navButtons).forEach(key => navButtons[key].addEventListener('click', () => switchView(key)));
            mainViews.bulkShift.addEventListener('change', handleBulkShiftChange);
            mainViews.bulkShift.addEventListener('keydown', handleBulkShiftKeyNavigation);
            mainViews.bulkShift.addEventListener('paste', handleBulkShiftPaste, true);
            document.getElementById('prevMonthBtn').addEventListener('click', () => { calendarDisplayDate.setMonth(calendarDisplayDate.getMonth() - 1); fetchDataForMonth(calendarDisplayDate); });
            document.getElementById('nextMonthBtn').addEventListener('click', () => { calendarDisplayDate.setMonth(calendarDisplayDate.getMonth() + 1); fetchDataForMonth(calendarDisplayDate); });
            document.getElementById('employeeHighlightSelect').addEventListener('change', (e) => { selectedEmployeeForHighlight = e.target.value; renderCalendar(); });
            document.getElementById('prevDayChartBtn').addEventListener('click', () => { chartDisplayDate.setDate(chartDisplayDate.getDate() - 1); document.getElementById('currentChartDate').value = formatDate(chartDisplayDate); fetchDataForMonth(chartDisplayDate); });
            document.getElementById('nextDayChartBtn').addEventListener('click', () => { chartDisplayDate.setDate(chartDisplayDate.getDate() + 1); document.getElementById('currentChartDate').value = formatDate(chartDisplayDate); fetchDataForMonth(chartDisplayDate); });
            document.getElementById('currentChartDate').addEventListener('change', (e) => { chartDisplayDate = new Date(e.target.value + "T00:00:00"); fetchDataForMonth(chartDisplayDate); });
            document.getElementById('prevMonthBulkBtn').addEventListener('click', () => { bulkViewDisplayMonth.setMonth(bulkViewDisplayMonth.getMonth() - 1); fetchDataForMonth(bulkViewDisplayMonth); });
            document.getElementById('nextMonthBulkBtn').addEventListener('click', () => { bulkViewDisplayMonth.setMonth(bulkViewDisplayMonth.getMonth() + 1); fetchDataForMonth(bulkViewDisplayMonth); });
            document.getElementById('toggleBulkShiftPeriodBtn').addEventListener('click', () => { bulkViewIsFirstHalf = !bulkViewIsFirstHalf; renderBulkShiftTable(); });
            
            shiftDetailModal.addEventListener('click', (event) => { 
                if (event.target === shiftDetailModal) {
                    shiftDetailModal.classList.add('hidden');
                }
            });
            
            // --- 初期表示処理 ---
            document.getElementById('currentChartDate').value = formatDate(chartDisplayDate);
            switchView('calendar');
        }
    });

    // --- Service Worker登録 ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then((registration) => {
                    console.log('Service Worker登録成功:', registration.scope);
                })
                .catch((error) => {
                    console.log('Service Worker登録失敗:', error);
                });
        });
    }
    </script>
</body>
</html>
