<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100">

    <header class="bg-slate-800 text-white p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold">シフト管理システム</h1>
        <div>
            <span id="currentUserInfo" class="mr-4 text-sm"></span>
            <select id="roleSwitcher" class="bg-slate-700 text-white rounded p-1 text-sm"></select>
        </div>
    </header>

    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-center" id="navButtons">
                <button id="showCalendarViewBtn" class="nav-btn"><i class="fas fa-calendar-alt mr-2"></i>カレンダー</button>
                <button id="showDailyChartViewBtn" class="nav-btn"><i class="fas fa-chart-bar mr-2"></i>日別グラフ</button>
                <button id="showBulkShiftViewBtn" class="nav-btn"><i class="fas fa-edit mr-2"></i>一括入力</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <div id="calendarView" class="view-content">
            <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow">
                <button id="prevMonthBtn" class="control-btn"><i class="fas fa-chevron-left"></i></button>
                <h2 id="calendarMonthYear" class="text-xl font-bold text-slate-700"></h2>
                <button id="nextMonthBtn" class="control-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="grid grid-cols-7 text-center font-bold text-slate-600">
                <div class="py-2 text-red-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-500">土</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1">
                </div>
        </div>

        <div id="dailyChartView" class="view-content hidden">
             <div class="flex justify-center items-center mb-4 bg-white p-3 rounded-lg shadow">
                <button id="prevDayChartBtn" class="control-btn"><i class="fas fa-chevron-left"></i> 前日</button>
                <input type="date" id="currentChartDate" class="mx-4 p-2 border rounded-md shadow-inner">
                <button id="nextDayChartBtn" class="control-btn">翌日 <i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="bg-white p-4 rounded-lg shadow" style="height: 70vh;">
                <canvas id="dailyShiftChart"></canvas>
            </div>
        </div>

        <div id="bulkShiftView" class="view-content hidden">
            <p>一括シフト入力ビューは現在開発中です。</p>
        </div>
    </main>
    
    <footer class="text-center p-4 text-xs text-slate-500 mt-8">
        <p>&copy; <span id="currentYear"></span> Shift Management System</p>
    </footer>

    <script src="js/script.js"></script>
    
</body>
</html>
