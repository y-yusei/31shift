<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF--8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフト管理</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100">

    <header class="bg-slate-800 text-white p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">シフト管理システム</h1>
        <div>
            <span id="currentUserInfo" class="mr-4"></span>
            <select id="roleSwitcher" class="bg-slate-700 text-white rounded p-1"></select>
        </div>
    </header>

    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-center space-x-4">
                <button id="showCalendarViewBtn" class="nav-btn"><i class="fas fa-calendar-alt mr-2"></i>カレンダー表示</button>
                <button id="showDailyChartViewBtn" class="nav-btn"><i class="fas fa-chart-bar mr-2"></i>日別グラフ表示</button>
                <button id="showBulkShiftViewBtn" class="nav-btn"><i class="fas fa-edit mr-2"></i>一括シフト入力</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <div id="calendarView" class="view-content">
            <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow">
                <button id="prevMonthBtn" class="px-3 py-1 bg-slate-200 rounded hover:bg-slate-300"><i class="fas fa-chevron-left"></i></button>
                <h2 id="calendarMonthYear" class="text-xl font-bold text-slate-700"></h2>
                <button id="nextMonthBtn" class="px-3 py-1 bg-slate-200 rounded hover:bg-slate-300"><i class="fas fa-chevron-right"></i></button>
                <div class="flex items-center">
                    <label for="employeeHighlightSelect" class="mr-2 text-sm text-slate-600">従業員ハイライト:</label>
                    <select id="employeeHighlightSelect" class="p-1 border rounded-md text-sm"></select>
                </div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 bg-white p-2 rounded-lg shadow">
                </div>
        </div>

        <div id="dailyChartView" class="view-content hidden">
             <div class="flex justify-center items-center mb-4 bg-white p-3 rounded-lg shadow">
                <button id="prevDayChartBtn" class="px-3 py-1 bg-slate-200 rounded hover:bg-slate-300"><i class="fas fa-chevron-left"></i> 前日</button>
                <input type="date" id="currentChartDate" class="mx-4 p-1 border rounded-md">
                <button id="nextDayChartBtn" class="px-3 py-1 bg-slate-200 rounded hover:bg-slate-300">翌日 <i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="bg-white p-4 rounded-lg shadow" style="height: 600px;">
                <canvas id="dailyShiftChart"></canvas>
            </div>
        </div>

        <div id="bulkShiftView" class="view-content hidden">
            <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow">
                <button id="prevMonthBulkBtn" class="px-3 py-1 bg-slate-200 rounded hover:bg-slate-300"><i class="fas fa-chevron-left"></i></button>
                <div>
                    <h2 id="bulkShiftMonthYear" class="text-xl font-bold text-slate-700"></h2>
                    <button id="toggleBulkShiftPeriodBtn" class="text-sm text-blue-600 hover:underline"></button>
                </div>
                <button id="nextMonthBulkBtn" class="px-3 py-1 bg-slate-200 rounded hover:bg-slate-300"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="bg-white p-4 rounded-lg shadow overflow-x-auto">
                <table id="bulkShiftTable" class="w-full text-sm text-left">
                    <thead><tr class="bg-slate-50"></tr></thead>
                    <tbody></tbody>
                    <tfoot>
                        <tr id="bulkShiftTableBreakTimesRow"></tr>
                        <tr id="bulkShiftTableShortageHoursRow"></tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>
    
    <div id="shiftDetailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
        <div id="modalContent" class="bg-white rounded-lg shadow-xl p-6 w-full max-w-lg">
            </div>
    </div>
    
    <footer class="text-center p-4 text-xs text-slate-500">
        <p>&copy; <span id="currentYear"></span> Shift Management System. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
    
</body>
</html>
