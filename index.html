<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31shift - Next Gen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
</head>
<body class="overflow-x-hidden">
    <!-- 3D背景 -->
    <div id="threejs-container" class="fixed inset-0 z-0"></div>
    
    <!-- パーティクル背景 -->
    <div id="particles-container" class="fixed inset-0 z-10"></div>
    
    <!-- メインコンテンツ -->
    <div class="relative z-20 min-h-screen">
        <!-- ログイン画面 -->
        <div id="loginScreen" class="flex items-center justify-center min-h-screen">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-header">
                        <div class="logo-3d">
                            <div class="logo-cube">
                                <div class="face front">31</div>
                                <div class="face back">SHIFT</div>
                                <div class="face right"></div>
                                <div class="face left"></div>
                                <div class="face top"></div>
                                <div class="face bottom"></div>
                            </div>
                        </div>
                        <h1 class="login-title">31shift</h1>
                        <p class="login-subtitle">Next Generation Shift Management</p>
                    </div>
                    
                    <div class="login-form">
                        <div class="input-group">
                            <div class="input-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <input type="text" id="loginId" class="glass-input" placeholder="ユーザーID" value="manager">
                            <div class="input-glow"></div>
                        </div>
                        
                        <div class="input-group">
                            <div class="input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input type="password" id="loginPassword" class="glass-input" placeholder="パスワード" value="pass123">
                            <div class="input-glow"></div>
                        </div>
                        
                        <button id="loginBtn" class="cyber-button">
                            <span class="button-text">ログイン</span>
                            <div class="button-glow"></div>
                            <div class="button-particles"></div>
                        </button>
                        
                        <div id="loginError" class="error-message"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- メインアプリケーション -->
        <div id="appContainer" class="hidden">
            <!-- フローティングナビゲーション -->
            <nav class="floating-nav">
                <div class="nav-orb">
                    <div class="orb-inner">
                        <div class="orb-core"></div>
                    </div>
                </div>
                <div class="nav-items">
                    <button class="nav-item active" data-view="calendar">
                        <div class="nav-icon">
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                        <span class="nav-label">カレンダー</span>
                        <div class="nav-glow"></div>
                    </button>
                    <button class="nav-item" data-view="dailyChart">
                        <div class="nav-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <span class="nav-label">グラフ</span>
                        <div class="nav-glow"></div>
                    </button>
                    <button class="nav-item" data-view="bulkShift">
                        <div class="nav-icon">
                            <i class="fas fa-table"></i>
                        </div>
                        <span class="nav-label">一括入力</span>
                        <div class="nav-glow"></div>
                    </button>
                </div>
            </nav>
            
            <!-- ヘッダー -->
            <header class="app-header">
                <div class="header-content">
                    <div class="header-left">
                        <div class="user-avatar">
                            <div class="avatar-ring"></div>
                            <div class="avatar-core">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                        <div class="user-info">
                            <span id="currentUserInfo" class="user-name"></span>
                            <div class="user-status">
                                <div class="status-dot"></div>
                                <span>オンライン</span>
                            </div>
                        </div>
                    </div>
                    <button id="logoutBtn" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>
            
            <!-- メインコンテンツエリア -->
            <main class="app-main">
                <!-- カレンダービュー -->
                <div id="calendarView" class="view-container active">
                    <div class="view-header">
                        <h2 class="view-title">カレンダー</h2>
                        <div class="view-controls">
                            <div class="control-group">
                                <label class="control-label">従業員フィルター</label>
                                <select id="employeeHighlightSelect" class="cyber-select">
                                    <option value="">全員表示</option>
                                </select>
                            </div>
                            <div class="month-controls">
                                <button id="prevMonthBtn" class="control-btn">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <div class="month-display">
                                    <span id="calendarMonthYear"></span>
                                </div>
                                <button id="nextMonthBtn" class="control-btn">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="calendar-container">
                        <div class="calendar-grid">
                            <div class="calendar-header">
                                <div class="day-header">日</div>
                                <div class="day-header">月</div>
                                <div class="day-header">火</div>
                                <div class="day-header">水</div>
                                <div class="day-header">木</div>
                                <div class="day-header">金</div>
                                <div class="day-header">土</div>
                            </div>
                            <div id="calendarGrid" class="calendar-days"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 日別グラフビュー -->
                <div id="dailyChartView" class="view-container">
                    <div class="view-header">
                        <h2 class="view-title">日別グラフ</h2>
                        <div class="view-controls">
                            <div class="date-controls">
                                <button id="prevDayChartBtn" class="control-btn">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <div class="date-display">
                                    <input type="date" id="currentChartDate" class="cyber-input">
                                </div>
                                <button id="nextDayChartBtn" class="control-btn">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <div class="chart-wrapper">
                            <canvas id="dailyShiftChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- 一括入力ビュー -->
                <div id="bulkShiftView" class="view-container">
                    <div class="view-header">
                        <h2 class="view-title">一括入力</h2>
                        <div class="view-controls">
                            <div class="month-controls">
                                <button id="prevMonthBulkBtn" class="control-btn">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <div class="month-display">
                                    <span id="bulkShiftMonthYear"></span>
                                </div>
                                <button id="nextMonthBulkBtn" class="control-btn">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                            <div class="period-controls">
                                <button id="toggleBulkShiftPeriodBtn" class="cyber-button-small">
                                    前半 (1-15日)
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="table-container">
                        <div class="table-wrapper">
                            <table id="bulkShiftTable" class="cyber-table">
                                <thead>
                                    <tr id="bulkShiftTableDateHeader"></tr>
                                </thead>
                                <tbody id="bulkShiftTableBody"></tbody>
                                <tfoot>
                                    <tr id="bulkShiftTableBreakTimesRow"></tr>
                                    <tr id="bulkShiftTableShortageHoursRow"></tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- モーダル -->
        <div id="shiftDetailModal" class="modal-overlay hidden">
            <div class="modal-container">
                <div class="modal-content" id="modalContent"></div>
            </div>
        </div>
    </div>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 3D背景の初期化
        init3DBackground();
        
        // パーティクルシステムの初期化
        initParticleSystem();
        
        // アニメーションの初期化
        initAnimations();
        
        // === ログイン機能 ===
        const credentials = { manager: { password: 'pass123', role: 'manager' }, user: { password: 'pass123', role: 'employee' } };
        const staticUsersForLogin = [{ id: 1, name: '管理者', role: 'manager' }];
        let currentUser = null;
        
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const loginIdInput = document.getElementById('loginId');
        const loginPasswordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');
        
        function handleLogin() {
            const id = loginIdInput.value.toLowerCase();
            const password = loginPasswordInput.value;
            const userCredential = credentials[id];
            
            if (userCredential && userCredential.password === password) {
                loginError.textContent = '';
                
                // ログインアニメーション
                gsap.to(loginScreen, {
                    opacity: 0,
                    scale: 0.8,
                    duration: 0.5,
                    ease: "power2.inOut",
                    onComplete: () => {
                        loginScreen.classList.add('hidden');
                        appContainer.classList.remove('hidden');
                        
                        // アプリ表示アニメーション
                        gsap.from(appContainer, {
                            opacity: 0,
                            y: 50,
                            duration: 0.8,
                            ease: "power2.out"
                        });
                    }
                });
                
                currentUser = (userCredential.role === 'manager') ? staticUsersForLogin[0] : { id: 0, name: '従業員', role: 'employee_viewer' };
                initializeApp();
            } else {
                loginError.textContent = 'IDまたはパスワードが正しくありません。';
                gsap.to(loginError, {
                    opacity: 1,
                    y: 0,
                    duration: 0.3
                });
            }
        }
        
        function handleLogout() {
            gsap.to(appContainer, {
                opacity: 0,
                scale: 0.9,
                duration: 0.5,
                ease: "power2.inOut",
                onComplete: () => {
                    currentUser = null;
                    appContainer.classList.add('hidden');
                    loginScreen.classList.remove('hidden');
                    loginPasswordInput.value = '';
                    
                    gsap.from(loginScreen, {
                        opacity: 0,
                        scale: 0.8,
                        duration: 0.8,
                        ease: "power2.out"
                    });
                }
            });
        }
        
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        loginPasswordInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleLogin(); });
        
        // === アプリケーション初期化 ===
        function initializeApp() {
            const API_BASE_URL = 'https://my-shift-backend.tamago-2483.workers.dev'; 
            let dailyShiftChartInstance = null;
            let appState = { users: [], shifts: {}, manualBreaks: {}, manualShortages: {} };
            let loadedMonths = {};

            const mainViews = { 
                calendar: document.getElementById('calendarView'), 
                dailyChart: document.getElementById('dailyChartView'), 
                bulkShift: document.getElementById('bulkShiftView') 
            };
            
            const today = new Date();
            let calendarDisplayDate = new Date(today.getFullYear(), today.getMonth(), 1);
            let chartDisplayDate = new Date();
            let bulkViewDisplayMonth = new Date(today.getFullYear(), today.getMonth(), 1);
            let bulkViewIsFirstHalf = today.getDate() <= 15;
            let selectedEmployeeForHighlight = null;
            
            // === Helper Functions ===
            function formatTime(d) { return `${('0' + d.getHours()).slice(-2)}:${('0' + d.getMinutes()).slice(-2)}`; }
            function formatDate(d) { return `${d.getFullYear()}-${('0' + (d.getMonth() + 1)).slice(-2)}-${('0' + d.getDate()).slice(-2)}`; }
            function formatDateToJapanese(d) { return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 (${['日','月','火','水','木','金','土'][d.getDay()]})`; }
            function formatDateToJapaneseShort(d) { return `${d.getMonth() + 1}/${d.getDate()}(${['日','月','火','水','木','金','土'][d.getDay()]})`;}
            function isToday(d) { return d.toDateString() === new Date().toDateString(); }
            function parseTimeToDate(t, b) {
                if (!t || !t.includes(':')) return null;
                const [h, m] = t.split(':').map(Number);
                const d = new Date(b);
                d.setHours(h, m, 0, 0);
                return d;
            }
            function isValidShiftTimeFormat(str) {
                if (!str) return true;
                return /^\d{2}:\d{2}\s*-\s*\d{2}:\d{2}$/.test(str.trim());
            }
            function normalizeShiftTimeInput(raw) {
                if (!raw) return '';
                let value = raw.trim();
                value = value.replace(/[〜~－ー–—]/g, '-');
                const parts = value.split('-').map(s => s.trim()).filter(Boolean);
                if (parts.length !== 2) return raw.trim();
                const normalizePart = (p) => {
                    if (p === '') return null;
                    const digits = p.replace(/[^0-9:]/g, '');
                    if (!digits) return null;
                    if (digits.includes(':')) {
                        const [hStr, mStr = '00'] = digits.split(':');
                        let h = parseInt(hStr, 10);
                        let m = parseInt(mStr, 10);
                        if (isNaN(h) || h < 0 || h > 23) return null;
                        if (isNaN(m) || m < 0 || m > 59) m = 0;
                        return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                    } else {
                        const num = digits;
                        if (num.length <= 2) {
                            const h = parseInt(num, 10);
                            if (isNaN(h) || h < 0 || h > 23) return null;
                            return `${('0' + h).slice(-2)}:00`;
                        } else if (num.length === 3) {
                            const h = parseInt(num.slice(0, 1), 10);
                            const m = parseInt(num.slice(1), 10);
                            if (isNaN(h) || h < 0 || h > 23 || isNaN(m) || m < 0 || m > 59) return null;
                            return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                        } else {
                            const h = parseInt(num.slice(0, 2), 10);
                            const m = parseInt(num.slice(2, 4), 10);
                            if (isNaN(h) || h < 0 || h > 23 || isNaN(m) || m < 0 || m > 59) return null;
                            return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                        }
                    }
                };
                const start = normalizePart(parts[0]);
                const end = normalizePart(parts[1]);
                if (!start || !end) return raw.trim();
                return `${start} - ${end}`;
            }
            
            // === Data Fetching & State ===
            async function fetchDataForMonth(date) {
                const year = date.getFullYear();
                const month = ('0' + (date.getMonth() + 1)).slice(-2);
                const monthKey = `${year}-${month}`;
                
                if (!loadedMonths[monthKey]) {
                    try {
                        const response = await fetch(`${API_BASE_URL}/api/data?month=${year}-${month}`);
                        if (!response.ok) throw new Error('API Error');
                        const data = await response.json();
                        
                        appState.users = data.users || [];
                        appState.shifts = { ...appState.shifts, ...data.shifts };
                        appState.manualBreaks = { ...appState.manualBreaks, ...data.manualBreaks };
                        appState.manualShortages = { ...appState.manualShortages, ...data.manualShortages };
                        
                        loadedMonths[monthKey] = true;
                    } catch (error) {
                        console.error("データ取得エラー:", error);
                        alert("APIサーバーへの接続に失敗しました。");
                        return;
                    }
                }
                
                updateUserInfo();
                refreshCurrentView();
            }
            
            // === 一括入力の変更を保存する関数 ===
            async function updateShift(shiftData) {
                try {
                    console.log('シフト更新リクエスト:', shiftData);
                    
                    if (!shiftData.userId || !shiftData.date) {
                        console.error('必須データが不足:', shiftData);
                        throw new Error('必須データが不足しています');
                    }
                    
                    const response = await fetch(`${API_BASE_URL}/api/update-shift`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(shiftData)
                    });
                    
                    console.log('APIレスポンス:', response.status, response.statusText);
                    
                    if (!response.ok) {
                        const errorBody = await response.text();
                        console.error('APIエラーレスポンス:', errorBody);
                        throw new Error(`APIエラー (ステータス: ${response.status}): ${errorBody}`);
                    }
                    
                    const result = await response.json();
                    console.log('API成功レスポンス:', result);
                    
                    if (!appState.shifts[shiftData.date]) {
                        appState.shifts[shiftData.date] = [];
                    }
                    
                    let existingShift = appState.shifts[shiftData.date].find(s => s.userId === shiftData.userId);
                    if (shiftData.time && shiftData.time.trim()) {
                        if (existingShift) {
                            existingShift.time = shiftData.time;
                        } else {
                            const user = appState.users.find(u => u.id === shiftData.userId);
                            appState.shifts[shiftData.date].push({
                                userId: shiftData.userId, 
                                time: shiftData.time,
                                fullName: user ? user.name : 'Unknown', 
                                role: user ? user.role : 'employee'
                            });
                        }
                    } else {
                        appState.shifts[shiftData.date] = appState.shifts[shiftData.date].filter(s => s.userId !== shiftData.userId);
                    }
                    
                    console.log('ローカル状態更新完了:', appState.shifts[shiftData.date]);
                    return true;
                } catch (error) {
                    console.error("シフトの更新に失敗しました:", error);
                    alert(`シフトの更新に失敗しました。\n\nエラー内容: ${error.message}`);
                    return false;
                }
            }
            
            async function updateManualData(date, breaks, shortages) {
                try {
                    console.log('手動データ更新リクエスト:', { date, breaks, shortages });
                    
                    if (!date) {
                        console.error('日付が不足:', { date, breaks, shortages });
                        throw new Error('日付が不足しています');
                    }
                    
                    const response = await fetch(`${API_BASE_URL}/api/update-manual-data`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ date, breaks, shortages })
                    });
                    
                    console.log('APIレスポンス:', response.status, response.statusText);
                    
                    if (!response.ok) {
                        const errorBody = await response.text();
                        console.error('APIエラーレスポンス:', errorBody);
                        throw new Error(`APIエラー (ステータス: ${response.status}): ${errorBody}`);
                    }
                    
                    const result = await response.json();
                    console.log('API成功レスポンス:', result);
                    
                    appState.manualBreaks[date] = breaks;
                    appState.manualShortages[date] = shortages;
                    
                    console.log('ローカル状態更新完了:', { breaks: appState.manualBreaks[date], shortages: appState.manualShortages[date] });
                    return true;
                } catch (error) {
                    console.error("手動データの更新に失敗しました:", error);
                    alert(`休憩・不足時間の更新に失敗しました。\n\nエラー内容: ${error.message}`);
                    return false;
                }
            }
            
            async function handleBulkShiftChange(event) {
                const input = event.target;
                if (!input.matches('input[type="text"]')) return;

                if (input.matches('.bulk-cell')) {
                    const normalized = normalizeShiftTimeInput(input.value);
                    if (normalized !== input.value) input.value = normalized;
                    if (!isValidShiftTimeFormat(input.value) && input.value.trim() !== '') {
                        input.style.outline = '2px solid #ef4444';
                        return;
                    } else {
                        input.style.outline = '';
                    }
                }

                const date = input.dataset.date;
                let success = false;
                
                if (input.matches('input[data-user-id]')) {
                    const userId = parseInt(input.dataset.userId, 10);
                    const time = input.value.trim();
                    success = await updateShift({ userId, date, time });
                } else if (input.matches('.break-time-input') || input.matches('.shortage-input')) {
                    const breakInput = mainViews.bulkShift.querySelector(`.break-time-input[data-date="${date}"]`);
                    const shortageInput = mainViews.bulkShift.querySelector(`.shortage-input[data-date="${date}"]`);
                    const breaks = breakInput ? breakInput.value.trim() : '';
                    const shortages = shortageInput ? shortageInput.value.trim() : '';
                    success = await updateManualData(date, breaks, shortages);
                }
                
                if(success) {
                    input.classList.add('input-success');
                    setTimeout(() => { input.classList.remove('input-success'); }, 800);
                } else {
                    refreshCurrentView();
                }
            }

            function setupBulkTableA11yFocus() {
                const inputs = Array.from(mainViews.bulkShift.querySelectorAll('.bulk-cell, .break-time-input, .shortage-input'));
                inputs.forEach(inp => inp.setAttribute('tabindex', '0'));
            }

            function focusNextCell(current, dx, dy) {
                const allRows = Array.from(document.querySelectorAll('#bulkShiftTable tbody tr'));
                if (allRows.length === 0) return;
                const bodyInputs = Array.from(document.querySelectorAll('#bulkShiftTable tbody input.bulk-cell'));
                const colsPerRow = bodyInputs.length / allRows.length;
                const index = bodyInputs.indexOf(current);
                if (index < 0) return;
                const row = Math.floor(index / colsPerRow);
                const col = index % colsPerRow;
                let newRow = Math.max(0, Math.min(allRows.length - 1, row + dy));
                let newCol = Math.max(0, Math.min(colsPerRow - 1, col + dx));
                const newIndex = newRow * colsPerRow + newCol;
                const target = bodyInputs[newIndex];
                if (target) target.focus();
            }

            function handleBulkShiftKeyNavigation(e) {
                const input = e.target;
                if (!input.matches('input.bulk-cell')) return;
                if (e.key === 'ArrowRight') { e.preventDefault(); focusNextCell(input, 1, 0); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); focusNextCell(input, -1, 0); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); focusNextCell(input, 0, 1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); focusNextCell(input, 0, -1); }
                else if (e.key === 'Enter') { e.preventDefault(); focusNextCell(input, 0, 1); }
            }

            async function handleBulkShiftPaste(e) {
                const active = document.activeElement;
                if (!active || !active.matches('input.bulk-cell')) return;
                const clipboardData = e.clipboardData || window.clipboardData;
                if (!clipboardData) return;
                const text = clipboardData.getData('text');
                if (!text) return;
                const rows = text.split(/\r?\n/).filter(r => r.trim() !== '');
                if (rows.length === 0) return;
                e.preventDefault();
                const tableBodyInputs = Array.from(document.querySelectorAll('#bulkShiftTable tbody input.bulk-cell'));
                const totalRows = document.querySelectorAll('#bulkShiftTable tbody tr').length;
                const colsPerRow = tableBodyInputs.length / totalRows;
                const startIndex = tableBodyInputs.indexOf(active);
                if (startIndex < 0) return;
                let cursorIndex = startIndex;
                for (let r = 0; r < rows.length; r++) {
                    const cells = rows[r].split(/\t/);
                    for (let c = 0; c < cells.length; c++) {
                        const target = tableBodyInputs[cursorIndex + c];
                        if (!target) break;
                        const normalized = normalizeShiftTimeInput(cells[c]);
                        target.value = normalized;
                        target.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                    cursorIndex += colsPerRow;
                }
            }

            // === UI/View Management ===
            function updateUserInfo() { 
                const currentUserInfo = document.getElementById('currentUserInfo');
                if (currentUserInfo) {
                    currentUserInfo.innerHTML = `ログイン中: <span class="font-bold">${currentUser.name}</span>`; 
                }
            }
            
            function setActiveNavButton(activeViewKey) {
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.view === activeViewKey) {
                        item.classList.add('active');
                    }
                });
            }

            async function switchView(viewKey) {
                Object.keys(mainViews).forEach(key => {
                    mainViews[key].classList.toggle('active', key === viewKey);
                });
                setActiveNavButton(viewKey);
                let targetDate;
                if (viewKey === 'calendar') targetDate = calendarDisplayDate;
                else if (viewKey === 'dailyChart') targetDate = chartDisplayDate;
                else if (viewKey === 'bulkShift') targetDate = bulkViewDisplayMonth;
                await fetchDataForMonth(targetDate);
            }
            
            function refreshCurrentView() {
                if (mainViews.calendar.classList.contains('active')) renderCalendar();
                else if (mainViews.dailyChart.classList.contains('active')) renderDailyShiftChart();
                else if (mainViews.bulkShift.classList.contains('active')) renderBulkShiftTable();
            }

            function renderCalendar() {
                const calendarGrid = document.getElementById('calendarGrid');
                if (!calendarGrid) return; 
                calendarGrid.innerHTML = '';
                const year = calendarDisplayDate.getFullYear();
                const month = calendarDisplayDate.getMonth();
                document.getElementById('calendarMonthYear').textContent = `${year}年 ${month + 1}月`;
                
                const employeeHighlightSelect = document.getElementById('employeeHighlightSelect');
                employeeHighlightSelect.innerHTML = `<option value="">全員表示</option>` + appState.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
                if (selectedEmployeeForHighlight) employeeHighlightSelect.value = selectedEmployeeForHighlight;

                const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
                const startDayOfWeek = new Date(year, month, 1).getDay();

                for (let i = 0; i < startDayOfWeek; i++) { 
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'calendar-day other-month';
                    calendarGrid.appendChild(emptyDay);
                }

                for (let day = 1; day <= lastDayOfMonth; day++) {
                    const date = new Date(year, month, day);
                    const dateString = formatDate(date);
                    const dayCell = document.createElement('div');
                    dayCell.className = 'calendar-day';
                    if(isToday(date)) dayCell.classList.add('today');

                    const shiftsForDay = appState.shifts[dateString] || [];
                    if (selectedEmployeeForHighlight && shiftsForDay.some(s => s.userId == selectedEmployeeForHighlight)) {
                        dayCell.classList.add('highlight-shift');
                    }
                    
                    dayCell.innerHTML = `<div class="calendar-day-header">${day}</div>`;
                    dayCell.addEventListener('click', () => showShiftDetailModal(date));
                    calendarGrid.appendChild(dayCell);
                }
            }
            
            function renderDailyShiftChart() {
                const dailyShiftChartCanvas = document.getElementById('dailyShiftChart');
                if (!dailyShiftChartCanvas) return;
                const dateString = formatDate(chartDisplayDate);
                const shiftsForDay = (appState.shifts[dateString] || []).slice();
                
                if (dailyShiftChartInstance) dailyShiftChartInstance.destroy();
                const ctx = dailyShiftChartCanvas.getContext('2d');
                ctx.clearRect(0, 0, dailyShiftChartCanvas.width, dailyShiftChartCanvas.height);
                
                if (shiftsForDay.length === 0) {
                    ctx.font = '16px Inter, sans-serif'; 
                    ctx.fillStyle = '#64748b'; 
                    ctx.textAlign = 'center';
                    ctx.fillText('この日のシフトはありません', dailyShiftChartCanvas.width / 2, 50);
                    return;
                }
                
                const sortedShifts = shiftsForDay
                    .filter(s => s && s.time && s.time.includes(' - '))
                    .sort((a, b) => {
                        const [aStartStr, aEndStr] = a.time.split(' - ');
                        const [bStartStr, bEndStr] = b.time.split(' - ');
                        const timeA_start = parseTimeToDate(aStartStr, chartDisplayDate);
                        const timeB_start = parseTimeToDate(bStartStr, chartDisplayDate);
                        const timeA_end = parseTimeToDate(aEndStr, chartDisplayDate);
                        const timeB_end = parseTimeToDate(bEndStr, chartDisplayDate);
                        
                        if (!timeA_start || !timeB_start) return 0;
                        
                        const startTimeDiff = timeA_start - timeB_start;
                        if (startTimeDiff !== 0) {
                            return startTimeDiff;
                        }
                        
                        if (!timeA_end || !timeB_end) return 0;
                        return timeA_end - timeB_end;
                    });

                const yLabels = sortedShifts.map(s => s.fullName);

                const chartDatasetData = sortedShifts.map(shift => {
                    const [startStr, endStr] = shift.time.split(' - ');
                    const mainStartDate = parseTimeToDate(startStr, chartDisplayDate);
                    const mainEndDate = parseTimeToDate(endStr, chartDisplayDate);
                    if(!mainStartDate || !mainEndDate) return null;
                    return {
                        x: [mainStartDate.getTime(), mainEndDate.getTime()], 
                        y: shift.fullName, 
                        originalShift: shift,
                        bgColor: shift.role === 'manager' ? 'rgba(250, 204, 21, 0.7)' : 'rgba(59, 130, 246, 0.7)'
                    };
                }).filter(Boolean);
                
                const chartMinTime = new Date(chartDisplayDate); 
                chartMinTime.setHours(9,0,0,0); 
                const chartMaxTime = new Date(chartDisplayDate); 
                chartMaxTime.setHours(21,0,0,0); 

                dailyShiftChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: { 
                        labels: yLabels, 
                        datasets: [{ 
                            label: '勤務時間', 
                            data: chartDatasetData, 
                            backgroundColor: chartDatasetData.map(d => d.bgColor) 
                        }] 
                    },
                    options: {
                        indexAxis: 'y', 
                        responsive: true, 
                        maintainAspectRatio: false,
                        scales: {
                            x: { 
                                type: 'time', 
                                min: chartMinTime.getTime(), 
                                max: chartMaxTime.getTime(),
                                time: { unit: 'hour', displayFormats: { hour: 'HH:mm' } },
                                ticks: { stepSize: 1 }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const start = new Date(context.raw.x[0]);
                                        const end = new Date(context.raw.x[1]);
                                        return `${context.raw.originalShift.fullName}: ${formatTime(start)} - ${formatTime(end)}`;
                                    }
                                }
                            }
                        }
                    }
                });
            }
            
            function renderBulkShiftTable() {
                const dateHeader = document.getElementById('bulkShiftTableDateHeader');
                const body = document.getElementById('bulkShiftTableBody');
                const breakRow = document.getElementById('bulkShiftTableBreakTimesRow');
                const shortageRow = document.getElementById('bulkShiftTableShortageHoursRow');
                if(!dateHeader || !body || !breakRow || !shortageRow) return;

                setupBulkTableA11yFocus();

                dateHeader.innerHTML = ''; 
                body.innerHTML = ''; 
                breakRow.innerHTML = ''; 
                shortageRow.innerHTML = ''; 

                const days = [];
                let headerHtml = '<th>従業員名</th>';
                const year = bulkViewDisplayMonth.getFullYear();
                const month = bulkViewDisplayMonth.getMonth();
                const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
                const startDay = bulkViewIsFirstHalf ? 1 : 16;
                const endDayLoop = bulkViewIsFirstHalf ? 15 : lastDayOfMonth;

                for (let day = startDay; day <= endDayLoop; day++) {
                    if (day > lastDayOfMonth) break; 
                    const currentDate = new Date(year, month, day);
                    days.push(formatDate(currentDate));
                    headerHtml += `<th class="p-2 text-sm font-medium whitespace-nowrap">${formatDateToJapaneseShort(currentDate)}</th>`;
                }
                dateHeader.innerHTML = headerHtml;
                
                const displayableUsers = [...appState.users].sort((a, b) => {
                    if (a.role === 'manager' && b.role !== 'manager') return -1;
                    if (a.role !== 'manager' && b.role === 'manager') return 1;
                    return a.id - b.id;
                });
                
                displayableUsers.forEach(user => {
                    let rowHtml = `<tr><th class="font-semibold p-2 text-left whitespace-nowrap ${user.role === 'manager' ? 'text-amber-700' : ''}">${user.name}</th>`;
                    days.forEach((dateString) => {
                        const shift = (appState.shifts[dateString] || []).find(s => s.userId === user.id);
                        rowHtml += `<td class="p-0"><input type="text" value="${shift && shift.time && shift.time.trim() ? shift.time : ""}" data-user-id="${user.id}" data-date="${dateString}" class="bulk-cell w-full h-full p-2 bg-transparent border-t-0 border-b-0 border-l-0 border-r text-center text-sm" style="border-color: var(--glass-border);" placeholder=" " inputmode="numeric" autocomplete="off"></td>`;
                    });
                    rowHtml += '</tr>';
                    body.innerHTML += rowHtml;
                });
                
                let breakTimesRowHtml = '<tr><th class="font-semibold p-2 text-left">休憩</th>'; 
                days.forEach(dateString => {
                    const breakValue = appState.manualBreaks[dateString];
                    breakTimesRowHtml += `<td class="p-0"><input type="text" class="break-time-input w-full h-full p-2 bg-transparent border-t-0 border-b-0 border-l-0 border-r text-center text-sm" value="${breakValue && breakValue.trim() ? breakValue : ''}" data-date="${dateString}" style="border-color: var(--glass-border);" placeholder=" "></td>`;
                });
                breakRow.innerHTML = breakTimesRowHtml;

                let shortageRowHtml = '<tr><th class="font-semibold p-2 text-left">不足</th>'; 
                days.forEach(dateString => {
                    const shortageValue = appState.manualShortages[dateString];
                    shortageRowHtml += `<td class="p-0"><input type="text" class="shortage-input w-full h-full p-2 bg-transparent border-t-0 border-b-0 border-l-0 border-r text-center text-sm" value="${shortageValue && shortageValue.trim() ? shortageValue : ''}" data-date="${dateString}" style="border-color: var(--glass-border);" placeholder=" "></td>`;
                });
                shortageRow.innerHTML = shortageRowHtml;

                document.getElementById('bulkShiftMonthYear').textContent = `${year}年 ${month + 1}月`;
                document.getElementById('toggleBulkShiftPeriodBtn').textContent = bulkViewIsFirstHalf ? '前半 (1-15日)' : `後半 (16-${lastDayOfMonth}日)`;

                setupBulkTableA11yFocus();
            }
            
            function showShiftDetailModal(date) {
                const dateString = formatDate(date);
                const modalContent = document.getElementById('modalContent');
                const shiftDetailModal = document.getElementById('shiftDetailModal');
                modalContent.innerHTML = ''; 
                const shiftsForDay = appState.shifts[dateString] || [];
                
                let contentHtml = `
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-200">
                        <div>
                            <h3 class="text-2xl font-bold text-gray-800">${formatDateToJapanese(date)}</h3>
                            <p class="text-sm text-gray-600 mt-1">シフト詳細</p>
                        </div>
                        <button id="closeModalBtn" class="w-12 h-12 bg-gradient-to-r from-gray-100 to-gray-200 hover:from-red-100 hover:to-red-200 text-gray-600 hover:text-red-600 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 transform hover:scale-110 flex items-center justify-center">
                            <i class="fas fa-times text-xl"></i>
                        </button>
                    </div>
                    <div class="space-y-4 max-h-80 overflow-y-auto">
                `;

                if (shiftsForDay.length > 0) {
                    shiftsForDay.forEach(shift => {
                        const user = appState.users.find(u => u.id === shift.userId) || { name: '不明' };
                        const isManager = user.role === 'manager';
                        contentHtml += `
                            <div class="p-5 rounded-2xl ${isManager ? 'bg-gradient-to-r from-amber-50 to-yellow-50 border border-amber-200' : 'bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200'} shadow-sm hover:shadow-md transition-all duration-300">
                                <div class="flex items-center justify-between mb-2">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 ${isManager ? 'bg-gradient-to-r from-amber-500 to-yellow-500' : 'bg-gradient-to-r from-blue-500 to-indigo-500'} rounded-xl flex items-center justify-center">
                                            <i class="fas fa-user text-white text-sm"></i>
                                        </div>
                                        <span class="font-semibold text-gray-800 ${isManager ? 'text-amber-700' : 'text-blue-700'}">${user.name}</span>
                                    </div>
                                    ${isManager ? '<span class="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full font-medium">管理者</span>' : ''}
                                </div>
                                <div class="flex items-center gap-2 text-sm text-gray-600">
                                    <i class="fas fa-clock text-gray-400"></i>
                                    <span>${shift.time}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    contentHtml += `
                        <div class="text-center py-12 text-gray-500">
                            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fas fa-calendar-times text-3xl text-gray-400"></i>
                            </div>
                            <p class="text-lg font-medium">この日のシフト情報はありません</p>
                            <p class="text-sm mt-1">シフトを追加してください</p>
                        </div>
                    `;
                }

                contentHtml += `</div>`;
                modalContent.innerHTML = contentHtml;
                shiftDetailModal.classList.remove('hidden');
                
                document.getElementById('closeModalBtn').addEventListener('click', () => {
                    shiftDetailModal.classList.add('hidden');
                });
            }
            
            // === イベントリスナー設定 ===
            updateUserInfo();
            
            // ナビゲーションボタン
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const viewKey = item.dataset.view;
                    switchView(viewKey);
                });
            });
            
            // 一括シフトイベント
            mainViews.bulkShift.addEventListener('change', handleBulkShiftChange);
            mainViews.bulkShift.addEventListener('keydown', handleBulkShiftKeyNavigation);
            mainViews.bulkShift.addEventListener('paste', handleBulkShiftPaste, true);
            
            // カレンダーイベント
            document.getElementById('prevMonthBtn').addEventListener('click', () => { 
                calendarDisplayDate.setMonth(calendarDisplayDate.getMonth() - 1); 
                fetchDataForMonth(calendarDisplayDate); 
            });
            document.getElementById('nextMonthBtn').addEventListener('click', () => { 
                calendarDisplayDate.setMonth(calendarDisplayDate.getMonth() + 1); 
                fetchDataForMonth(calendarDisplayDate); 
            });
            document.getElementById('employeeHighlightSelect').addEventListener('change', (e) => { 
                selectedEmployeeForHighlight = e.target.value; 
                renderCalendar(); 
            });
            
            // 日別グラフイベント
            document.getElementById('prevDayChartBtn').addEventListener('click', () => { 
                chartDisplayDate.setDate(chartDisplayDate.getDate() - 1); 
                document.getElementById('currentChartDate').value = formatDate(chartDisplayDate); 
                fetchDataForMonth(chartDisplayDate); 
            });
            document.getElementById('nextDayChartBtn').addEventListener('click', () => { 
                chartDisplayDate.setDate(chartDisplayDate.getDate() + 1); 
                document.getElementById('currentChartDate').value = formatDate(chartDisplayDate); 
                fetchDataForMonth(chartDisplayDate); 
            });
            document.getElementById('currentChartDate').addEventListener('change', (e) => { 
                chartDisplayDate = new Date(e.target.value + "T00:00:00"); 
                fetchDataForMonth(chartDisplayDate); 
            });
            
            // 一括入力イベント
            document.getElementById('prevMonthBulkBtn').addEventListener('click', () => { 
                bulkViewDisplayMonth.setMonth(bulkViewDisplayMonth.getMonth() - 1); 
                fetchDataForMonth(bulkViewDisplayMonth); 
            });
            document.getElementById('nextMonthBulkBtn').addEventListener('click', () => { 
                bulkViewDisplayMonth.setMonth(bulkViewDisplayMonth.getMonth() + 1); 
                fetchDataForMonth(bulkViewDisplayMonth); 
            });
            document.getElementById('toggleBulkShiftPeriodBtn').addEventListener('click', () => { 
                bulkViewIsFirstHalf = !bulkViewIsFirstHalf; 
                renderBulkShiftTable(); 
            });
            
            // モーダルイベント
            const shiftDetailModal = document.getElementById('shiftDetailModal');
            shiftDetailModal.addEventListener('click', (event) => { 
                if (event.target === shiftDetailModal) {
                    shiftDetailModal.classList.add('hidden');
                }
            });
            
            // === 初期表示処理 ===
            document.getElementById('currentChartDate').value = formatDate(chartDisplayDate);
            switchView('calendar');
        }
        
        // 3D背景の初期化
        function init3DBackground() {
            const container = document.getElementById('threejs-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);
            
            // ジオメトリの作成
            const geometry = new THREE.IcosahedronGeometry(2, 0);
            const material = new THREE.MeshPhongMaterial({
                color: 0x667eea,
                wireframe: true,
                transparent: true,
                opacity: 0.1
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            
            // ライトの追加
            const light = new THREE.DirectionalLight(0xffffff, 0.5);
            light.position.set(1, 1, 1);
            scene.add(light);
            
            camera.position.z = 5;
            
            // アニメーションループ
            function animate() {
                requestAnimationFrame(animate);
                mesh.rotation.x += 0.005;
                mesh.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();
            
            // リサイズ対応
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        // パーティクルシステムの初期化
        function initParticleSystem() {
            const container = document.getElementById('particles-container');
            const particles = [];
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
                particles.push(particle);
            }
        }
        
        // アニメーションの初期化
        function initAnimations() {
            // ロゴの3D回転アニメーション
            gsap.to('.logo-cube', {
                rotationY: 360,
                duration: 8,
                repeat: -1,
                ease: "none"
            });
            
            // ナビゲーションアイテムのホバーアニメーション
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('mouseenter', () => {
                    gsap.to(item, {
                        scale: 1.1,
                        duration: 0.3,
                        ease: "power2.out"
                    });
                });
                
                item.addEventListener('mouseleave', () => {
                    gsap.to(item, {
                        scale: 1,
                        duration: 0.3,
                        ease: "power2.out"
                    });
                });
            });
        }
    });
    </script>
</body>
</html>
