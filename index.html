    <style>
        /* === カラーパレット定義 === */
        :root {
            --bg-primary: #f8fafc; /* メイン背景 */
            --bg-secondary: #ffffff; /* カード背景 */
            --bg-accent: #f1f5f9; /* アクセント背景 */
            --text-primary: #1e293b; /* メインテキスト */
            --text-secondary: #64748b; /* サブテキスト */
            --border-color: #e2e8f0; /* 境界線 */
            --primary-brand: #4f46e5; /* プライマリブランドカラー */
            --primary-brand-hover: #4338ca;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
        }
        
        /* === 基本スタイル === */
        body { 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            background-color: var(--bg-primary); 
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        /* === 共通コンポーネント === */
        .card {
            background-color: var(--bg-secondary);
            border-radius: 0.75rem;
            box-shadow: var(--shadow);
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .main-view, .modal-content {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }
        h1, h2, h3 { color: var(--text-primary); }
        input, select {
            background-color: var(--bg-secondary);
            border-color: var(--border-color);
            color: var(--text-primary);
            border-radius: 0.5rem;
        }
        input:focus, select:focus {
            border-color: var(--primary-brand);
            box-shadow: 0 0 0 2px var(--primary-brand-hover);
            outline: none;
        }
        .input-success {
            border-color: #22c55e !important; /* green-500 */
            transition: border-color 0.5s;
        }


        /* === ナビゲーションボタン === */
        .nav-button {
            transition: all 0.2s ease-in-out;
        }
        .nav-button.active {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        /* === カレンダー === */
        .calendar-day { 
            border: 1px solid var(--border-color);
            min-height: 100px; position: relative;
            background-color: var(--bg-secondary);
            border-radius: 0.375rem; cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .calendar-day:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        .calendar-day-header { font-weight: 500; color: var(--text-secondary); }
        .today { background-color: #fef2f2; }
        .today .calendar-day-header { color: #dc2626; font-weight: 700; }
        .other-month { background-color: var(--bg-accent); color: var(--text-secondary); cursor: default; }
        .other-month:hover { transform: none; box-shadow: none; }
        
        /* === モーダル === */
        .modal { background-color: rgba(0,0,0,0.6); }

        /* === 一括シフトテーブル === */
        .bulk-shift-table th, .bulk-shift-table td { border: 1px solid var(--border-color); }
        .bulk-shift-table thead th { background-color: var(--bg-accent); position: sticky; top: 0; z-index: 20;}
        .bulk-shift-table tbody th { background-color: var(--bg-accent); position: sticky; left: 0; z-index: 10;}
        .bulk-shift-table thead th:first-child { left: 0; z-index: 30; }
        .bulk-shift-table tfoot th { background-color: var(--bg-accent); position: sticky; left: 0; z-index: 10;}
        .bulk-shift-table input[type="text"] { border: none; }
        
        /* スマホ対応の一括シフトテーブル */
        @media (max-width: 768px) {
            .bulk-shift-table {
                font-size: 0.7rem;
            }
            .bulk-shift-table th, .bulk-shift-table td {
                padding: 0.2rem;
                min-width: 100px;
            }
            .bulk-shift-table input[type="text"] {
                font-size: 0.7rem;
                padding: 0.2rem;
                min-width: 95px;
            }
            .bulk-shift-table tbody th {
                min-width: 110px;
                font-size: 0.7rem;
            }
        }
        
        /* タブレット対応 */
        @media (max-width: 1024px) and (min-width: 769px) {
            .bulk-shift-table {
                font-size: 0.8rem;
            }
            .bulk-shift-table th, .bulk-shift-table td {
                padding: 0.3rem;
                min-width: 120px;
            }
            .bulk-shift-table input[type="text"] {
                font-size: 0.8rem;
                padding: 0.3rem;
                min-width: 115px;
            }
        }
        
        /* デスクトップ対応 */
        @media (min-width: 1025px) {
            .bulk-shift-table th, .bulk-shift-table td {
                min-width: 140px;
            }
            .bulk-shift-table input[type="text"] {
                min-width: 135px;
            }
            .bulk-shift-table tbody th {
                min-width: 150px;
            }
        }
    </style>
</head>
<body class="text-slate-800">

    <script>
    document.addEventListener('DOMContentLoaded', function() {


        // --- ログイン機能 ---
        let currentUser = null; 
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const loginIdInput = document.getElementById('loginId');
        const loginPasswordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');
        
        async function handleLogin() {
            const username = loginIdInput.value;
            const password = loginPasswordInput.value;
            
            if (!username || !password) {
                loginError.textContent = 'ユーザー名とパスワードを入力してください。';
                return;
            }

            try {
                const response = await fetch('https://my-shift-backend.tamago-2483.workers.dev/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                
                if (data.success) {
                    loginError.textContent = '';
                    currentUser = data.user;
                    loginScreen.classList.add('hidden');
                    appContainer.classList.remove('hidden');
                    initializeApp();
                } else {
                    loginError.textContent = data.message || 'ログインに失敗しました。';
                }
            } catch (error) {
                console.error('Login error:', error);
                loginError.textContent = 'ログイン中にエラーが発生しました。';
            }
        }
        function handleLogout() {
            currentUser = null; appContainer.classList.add('hidden'); loginScreen.classList.remove('hidden');
            loginPasswordInput.value = ''; location.reload(); 
        }
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        loginPasswordInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleLogin(); });

        // --- アプリケーション初期化 ---
        function initializeApp() {
            const API_BASE_URL = 'https://my-shift-backend.tamago-2483.workers.dev'; 
            let dailyShiftChartInstance = null;
            let appState = { users: [], shifts: {}, manualBreaks: {}, manualShortages: {} };
            let loadedMonths = {};
            let currentShiftPeriod = null;
            let shiftSubmissions = {};
            let shiftWishChartInstance = null;
            let wishDisplayDate = new Date();
            let wishSubmissions = [];
            
            // デフォルト時間の管理
            const DEFAULT_START_TIME = '09:00';
            const DEFAULT_END_TIME = '21:00';
            
            // ローカルストレージから前回の時間を取得
            function getLastInputTimes() {
                try {
                    const lastTimes = localStorage.getItem('lastShiftTimes');
                    if (lastTimes) {
                        const parsed = JSON.parse(lastTimes);
                        return {
                            startTime: parsed.startTime || DEFAULT_START_TIME,
                            endTime: parsed.endTime || DEFAULT_END_TIME,
                            breakTime: parsed.breakTime || ''
                        };
                    }
                } catch (error) {
                    console.error('Error loading last input times:', error);
                }
                return {
                    startTime: DEFAULT_START_TIME,
                    endTime: DEFAULT_END_TIME,
                    breakTime: ''
                };
            }
            
            // ローカルストレージに時間を保存
            function saveLastInputTimes(startTime, endTime, breakTime) {
                try {
                    const times = { startTime, endTime, breakTime };
                    localStorage.setItem('lastShiftTimes', JSON.stringify(times));
                } catch (error) {
                    console.error('Error saving last input times:', error);
                }
            }

            const mainViews = { 
                calendar: document.getElementById('calendarView'), 
                dailyChart: document.getElementById('dailyChartView'), 
                bulkShift: document.getElementById('bulkShiftView'),
                shiftSubmission: document.getElementById('shiftSubmissionView'),
                shiftManagement: document.getElementById('shiftManagementView'),
                shiftWish: document.getElementById('shiftWishView')
            };
            
            mainViews.calendar.innerHTML = `

            mainViews.dailyChart.innerHTML = `

            mainViews.shiftSubmission.innerHTML = `

                            <i class="fas fa-info-circle text-blue-500 mr-2"></i>
                            <span id="submissionPeriodInfo" class="text-blue-700">シフト提出期間を読み込み中...</span>

                        <div class="mb-4">

                            <div class="text-sm text-gray-600 mb-2">日付をクリックしてシフトを入力してください</div>
                            <div id="shiftSubmissionCalendar" class="grid grid-cols-7 gap-2 text-center font-semibold mb-2 text-sm">
                                <div class="text-red-600">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-600">土</div>
                            </div>
                            <div id="shiftSubmissionGrid" class="grid grid-cols-7 gap-2"></div>
                        </div>
                        <div class="flex gap-4">
                            <button id="saveShiftSubmissionBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg">
                                <i class="fas fa-save mr-2"></i>シフト提出
                            </button>
                            <button id="clearShiftSubmissionBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg">
                                <i class="fas fa-eraser mr-2"></i>クリア

                        </div>
                    </div>
                    <div id="shiftSubmissionClosed" class="hidden bg-red-50 border border-red-200 rounded-lg p-4">
                        <div class="flex items-center">
                            <i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>
                            <span class="text-red-700">現在、シフト提出期間ではありません。</span>

            mainViews.shiftManagement.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-semibold mb-4">シフト管理</h2>
                    <div class="mb-6">
                        <h3 class="text-lg font-semibold mb-4">シフト提出期間設定</h3>
                        <div class="bg-white border border-gray-200 rounded-lg p-4 mb-4">
                            <form id="shiftPeriodForm">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div>
                                        <label for="periodYear" class="block text-sm font-medium text-gray-700 mb-1">年</label>

                                            <option value="first">前半（1-15日）</option>

                                        </select>
                                    </div>
                                    <div>
                                        <label for="submissionStartDate" class="block text-sm font-medium text-gray-700 mb-1">提出開始日</label>
                                        <input type="date" id="submissionStartDate" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                                    </div>
                                    <div>
                                        <label for="displayDeadline" class="block text-sm font-medium text-gray-700 mb-1">表示上の締切日</label>
                                        <input type="date" id="displayDeadline" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                                    </div>
                                    <div>
                                        <label for="actualDeadline" class="block text-sm font-medium text-gray-700 mb-1">実際の締切日</label>
                                        <input type="date" id="actualDeadline" class="w-full px-3 py-2 border border-gray-300 rounded-md">

                            </form>
                        </div>

            function formatDateToJapanese(d) { return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 (${['日','月','火','水','木','金','土'][d.getDay()]})`; }

            function normalizeShiftTimeInput(raw) {
                if (!raw) return '';
                let value = raw.trim();
                value = value.replace(/[〜~－ー–—]/g, '-');
                const parts = value.split('-').map(s => s.trim()).filter(Boolean);
                if (parts.length !== 2) return raw.trim();
                const normalizePart = (p) => {
                    if (p === '') return null;
                    const digits = p.replace(/[^0-9:]/g, '');
                    if (!digits) return null;
                    if (digits.includes(':')) {
                        const [hStr, mStr = '00'] = digits.split(':');
                        let h = parseInt(hStr, 10);
                        let m = parseInt(mStr, 10);
                        if (isNaN(h) || h < 0 || h > 23) return null;
                        if (isNaN(m) || m < 0 || m > 59) m = 0;
                        return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                    } else {
                        const num = digits;
                        if (num.length <= 2) {
                            const h = parseInt(num, 10);
                            if (isNaN(h) || h < 0 || h > 23) return null;
                            return `${('0' + h).slice(-2)}:00`;
                        } else if (num.length === 3) {
                            const h = parseInt(num.slice(0, 1), 10);
                            const m = parseInt(num.slice(1), 10);
                            if (isNaN(h) || h < 0 || h > 23 || isNaN(m) || m < 0 || m > 59) return null;
                            return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                        } else {
                            const h = parseInt(num.slice(0, 2), 10);
                            const m = parseInt(num.slice(2, 4), 10);
                            if (isNaN(h) || h < 0 || h > 23 || isNaN(m) || m < 0 || m > 59) return null;
                            return `${('0' + h).slice(-2)}:${('0' + m).slice(-2)}`;
                        }
                    }
                };
                const start = normalizePart(parts[0]);
                const end = normalizePart(parts[1]);
                if (!start || !end) return raw.trim();
                return `${start} - ${end}`;
            }

            function focusNextCell(current, dx, dy) {
                const allRows = Array.from(document.querySelectorAll('#bulkShiftTable tbody tr'));
                if (allRows.length === 0) return;
                const bodyInputs = Array.from(document.querySelectorAll('#bulkShiftTable tbody input.bulk-cell'));
                const colsPerRow = bodyInputs.length / allRows.length;
                const index = bodyInputs.indexOf(current);
                if (index < 0) return;
                const row = Math.floor(index / colsPerRow);
                const col = index % colsPerRow;
                let newRow = Math.max(0, Math.min(allRows.length - 1, row + dy));
                let newCol = Math.max(0, Math.min(colsPerRow - 1, col + dx));
                const newIndex = newRow * colsPerRow + newCol;
                const target = bodyInputs[newIndex];
                if (target) target.focus();
            }

            function handleBulkShiftKeyNavigation(e) {
                const input = e.target;
                if (!input.matches('input.bulk-cell')) return;
                if (e.key === 'ArrowRight') { e.preventDefault(); focusNextCell(input, 1, 0); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); focusNextCell(input, -1, 0); }
                else if (e.key === 'ArrowDown') { e.preventDefault(); focusNextCell(input, 0, 1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); focusNextCell(input, 0, -1); }
                else if (e.key === 'Enter') { e.preventDefault(); focusNextCell(input, 0, 1); }
            }

            async function handleBulkShiftPaste(e) {
                const active = document.activeElement;
                if (!active || !active.matches('input.bulk-cell')) return;
                const clipboardData = e.clipboardData || window.clipboardData;
                if (!clipboardData) return;
                const text = clipboardData.getData('text');
                if (!text) return;
                const rows = text.split(/\r?\n/).filter(r => r.trim() !== '');
                if (rows.length === 0) return;
                e.preventDefault();
                const tableBodyInputs = Array.from(document.querySelectorAll('#bulkShiftTable tbody input.bulk-cell'));
                const totalRows = document.querySelectorAll('#bulkShiftTable tbody tr').length;
                const colsPerRow = tableBodyInputs.length / totalRows;
                const startIndex = tableBodyInputs.indexOf(active);
                if (startIndex < 0) return;
                let cursorIndex = startIndex;
                for (let r = 0; r < rows.length; r++) {
                    const cells = rows[r].split(/\t/);
                    for (let c = 0; c < cells.length; c++) {
                        const target = tableBodyInputs[cursorIndex + c];
                        if (!target) break;
                        const normalized = normalizeShiftTimeInput(cells[c]);
                        target.value = normalized;
                        target.dispatchEvent(new Event('change', { bubbles: true }));
                    }
                    cursorIndex += colsPerRow;
                }
            }

                // デフォルト値を決定

                    defaultStartTime = existingSubmission.startTime;
                    defaultEndTime = existingSubmission.endTime;
                    defaultBreakTime = existingSubmission.breakTime;
                } else {

                                          placeholder="特記事項があれば入力してください">${existingSubmission ? existingSubmission.notes : ''}</textarea>
                            </div>
                        </div>
                        <div class="flex gap-2 mt-6">
                            <button type="submit" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg flex-1">

                shiftSubmissionModalHandlers.closeHandler = () => {
                    modal.classList.add('hidden');

                shiftSubmissionModalHandlers.submitHandler = async (e) => {
                    e.preventDefault();
                    const startTime = document.getElementById('startTime').value;
                    const endTime = document.getElementById('endTime').value;
                    const breakTime = document.getElementById('breakTime').value;
                    const notes = document.getElementById('notes').value;

                    if (!startTime || !endTime) {
                        alert('開始時間と終了時間は必須です。');
                        return;
                    }

                    // 入力した時間をローカルストレージに保存
                    saveLastInputTimes(startTime, endTime, breakTime);

                    // ローカル状態を更新
                    shiftSubmissions[dateString] = {
                        submissionDate: dateString,
                        startTime: startTime,
                        endTime: endTime,
                        breakTime: breakTime,
                        notes: notes
                    };

                    modal.classList.add('hidden');
                    renderShiftSubmissionCalendar();
                };

                shiftSubmissionModalHandlers.deleteHandler = () => {
                    delete shiftSubmissions[dateString];
                    modal.classList.add('hidden');
                    renderShiftSubmissionCalendar();
                };

                // イベントリスナーを設定
                document.getElementById('closeModalBtn').addEventListener('click', shiftSubmissionModalHandlers.closeHandler);
                document.getElementById('shiftSubmissionFormModal').addEventListener('submit', shiftSubmissionModalHandlers.submitHandler);

                    document.getElementById('deleteSubmissionBtn').addEventListener('click', shiftSubmissionModalHandlers.deleteHandler);

                    document.getElementById('deleteSubmissionBtn').style.display = 'none';

            // 送信中の状態を管理
            let isSubmittingShift = false;

            async function saveShiftSubmission() {
                if (isSubmittingShift) {
                    console.log('既に送信中です。重複送信を防ぎます。');
                    return;
                }

                if (!currentShiftPeriod || !currentUser) {
                    alert('シフト提出期間またはユーザー情報が取得できません。');
                    return;
                }

                const submissions = Object.values(shiftSubmissions).filter(sub => 
                    sub.startTime && sub.endTime
                );

                if (submissions.length === 0) {
                    alert('シフトを入力してください。');
                    return;
                }

                // 送信開始
                isSubmittingShift = true;
                
                // 送信ボタンを無効化
                const submitBtn = document.getElementById('submitShiftBtn');
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>送信中...';
                }

                // 最新の入力時間を保存（最後の提出データから）
                if (submissions.length > 0) {
                    const lastSubmission = submissions[submissions.length - 1];
                    saveLastInputTimes(lastSubmission.startTime, lastSubmission.endTime, lastSubmission.breakTime);
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/api/shift-submissions`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            periodId: currentShiftPeriod.id,
                            userId: currentUser.id,
                            submissions: submissions
                        })
                    });

                    if (!response.ok) {
                        const error = await response.text();
                        throw new Error(error);
                    }

                    alert('シフト提出が完了しました。');
                    // 提出後はローカル状態をクリア
                    shiftSubmissions = {};
                    renderShiftSubmissionCalendar();
                } catch (error) {
                    console.error('Error saving shift submission:', error);
                    alert(`シフト提出に失敗しました: ${error.message}`);
                } finally {
                    // 送信完了
                    isSubmittingShift = false;
                    
                    // 送信ボタンを有効化
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>シフト提出';
                    }
                }
            }

            async function loadSubmissionsList() {
                const submissionsList = document.getElementById('submissionsList');
                submissionsList.innerHTML = '<div class="text-center text-gray-500 py-8">提出データを読み込み中...</div>';

                try {
                    const submissions = await fetchShiftSubmissions(currentShiftPeriod?.id);
                    
                    if (submissions.length === 0) {
                        submissionsList.innerHTML = '<div class="text-center text-gray-500 py-8">提出データがありません。</div>';
                        return;
                    }

                    // ユーザーごとにグループ化
                    const groupedSubmissions = submissions.reduce((acc, submission) => {
                        const userId = submission.user_id;
                        if (!acc[userId]) {
                            acc[userId] = {
                                user_name: submission.user_name,
                                submissions: []
                            };
                        }
                        acc[userId].submissions.push(submission);
                        return acc;
                    }, {});

                    let html = '';
                    Object.values(groupedSubmissions).forEach(group => {
                        html += `
                            <div class="bg-white border border-gray-200 rounded-lg p-4">
                                <h4 class="font-semibold text-lg mb-3">${group.user_name}</h4>
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
                                    ${group.submissions.map(sub => `
                                        <div class="border border-gray-200 rounded p-2 text-sm">
                                            <div class="font-medium">${sub.submission_date}</div>
                                            <div>${sub.start_time} - ${sub.end_time}</div>
                                            ${sub.break_time ? `<div class="text-gray-600">休憩: ${sub.break_time}分</div>` : ''}
                                            ${sub.notes ? `<div class="text-gray-600">${sub.notes}</div>` : ''}
                                            <div class="mt-2">
                                                <span class="px-2 py-1 rounded text-xs ${
                                                    sub.status === 'approved' ? 'bg-green-100 text-green-800' :
                                                    sub.status === 'rejected' ? 'bg-red-100 text-red-800' :
                                                    'bg-yellow-100 text-yellow-800'
                                                }">
                                                    ${sub.status === 'approved' ? '承認済み' :
                                                      sub.status === 'rejected' ? '却下' : '未承認'}
                                                </span>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    });

                    submissionsList.innerHTML = html;
                } catch (error) {
                    console.error('Error loading submissions:', error);
                    submissionsList.innerHTML = '<div class="text-center text-red-500 py-8">データの読み込みに失敗しました。</div>';

            function renderCalendar() {
                const calendarGrid = document.getElementById('calendarGrid');
                if (!calendarGrid) return; 
                calendarGrid.innerHTML = '';
                const year = calendarDisplayDate.getFullYear();
                const month = calendarDisplayDate.getMonth();
                document.getElementById('calendarMonthYear').textContent = `${year}年 ${month + 1}月`;
                
                const employeeHighlightSelect = document.getElementById('employeeHighlightSelect');
                employeeHighlightSelect.innerHTML = `<option value="">全員表示</option>` + appState.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
                if (selectedEmployeeForHighlight) employeeHighlightSelect.value = selectedEmployeeForHighlight;

                const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
                const startDayOfWeek = new Date(year, month, 1).getDay();

                for (let i = 0; i < startDayOfWeek; i++) { calendarGrid.insertAdjacentHTML('beforeend', `<div class="other-month"></div>`); }

                for (let day = 1; day <= lastDayOfMonth; day++) {
                    const date = new Date(year, month, day);
                    const dateString = formatDate(date);
                    const dayCell = document.createElement('div');
                    dayCell.className = 'calendar-day p-2';
                    if(isToday(date)) dayCell.classList.add('today');

                    const shiftsForDay = appState.shifts[dateString] || [];
                    if (selectedEmployeeForHighlight && shiftsForDay.some(s => s.userId == selectedEmployeeForHighlight)) {
                        dayCell.classList.add('bg-indigo-100');
                    }
                    
                    dayCell.innerHTML = `<div class="calendar-day-header text-sm">${day}</div>`;
                    dayCell.addEventListener('click', () => showShiftDetailModal(date));
                    calendarGrid.appendChild(dayCell);
                }
            }
            
            function renderDailyShiftChart() {
                const dailyShiftChartCanvas = document.getElementById('dailyShiftChart');
                if (!dailyShiftChartCanvas) return;
                const dateString = formatDate(chartDisplayDate);
                const shiftsForDay = (appState.shifts[dateString] || []).slice();
                
                if (dailyShiftChartInstance) dailyShiftChartInstance.destroy();
                const ctx = dailyShiftChartCanvas.getContext('2d');
                ctx.clearRect(0, 0, dailyShiftChartCanvas.width, dailyShiftChartCanvas.height);
                
                if (shiftsForDay.length === 0) {
                    ctx.font = '16px Inter, sans-serif'; ctx.fillStyle = '#64748b'; ctx.textAlign = 'center';
                    ctx.fillText('この日のシフトはありません', dailyShiftChartCanvas.width / 2, 50);
                    return;
                }
                
                const sortedShifts = shiftsForDay
                    .filter(s => s && s.time && s.time.includes(' - '))
                    .sort((a, b) => {
                        const [aStartStr, aEndStr] = a.time.split(' - ');
                        const [bStartStr, bEndStr] = b.time.split(' - ');
                        const timeA_start = parseTimeToDate(aStartStr, chartDisplayDate);
                        const timeB_start = parseTimeToDate(bStartStr, chartDisplayDate);
                        const timeA_end = parseTimeToDate(aEndStr, chartDisplayDate);
                        const timeB_end = parseTimeToDate(bEndStr, chartDisplayDate);
                        
                        if (!timeA_start || !timeB_start) return 0;
                        
                        // まず出勤時間で比較
                        const startTimeDiff = timeA_start - timeB_start;
                        if (startTimeDiff !== 0) {
                            return startTimeDiff;
                        }
                        
                        // 出勤時間が同じ場合は退勤時間で比較
                        if (!timeA_end || !timeB_end) return 0;
                        return timeA_end - timeB_end;
                    });

                const yLabels = sortedShifts.map(s => s.fullName);

                const chartDatasetData = sortedShifts.map(shift => {
                    const [startStr, endStr] = shift.time.split(' - ');
                    const mainStartDate = parseTimeToDate(startStr, chartDisplayDate);
                    const mainEndDate = parseTimeToDate(endStr, chartDisplayDate);
                    if(!mainStartDate || !mainEndDate) return null;
                    return {
                        x: [mainStartDate.getTime(), mainEndDate.getTime()], y: shift.fullName, originalShift: shift,
                        bgColor: shift.role === 'manager' ? 'rgba(250, 204, 21, 0.7)' : 'rgba(59, 130, 246, 0.7)'
                    };
                }).filter(Boolean);
                
                const chartMinTime = new Date(chartDisplayDate); chartMinTime.setHours(9,0,0,0); 
                const chartMaxTime = new Date(chartDisplayDate); chartMaxTime.setHours(21,0,0,0); 

                dailyShiftChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: { labels: yLabels, datasets: [{ label: '勤務時間', data: chartDatasetData, backgroundColor: chartDatasetData.map(d => d.bgColor) }] },
                    options: {
                        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                        scales: {
                            x: { 
                                type: 'time', min: chartMinTime.getTime(), max: chartMaxTime.getTime(),
                                time: { unit: 'hour', displayFormats: { hour: 'HH:mm' } },
                                ticks: { stepSize: 1 }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const start = new Date(context.raw.x[0]);
                                        const end = new Date(context.raw.x[1]);
                                        return `${context.raw.originalShift.fullName}: ${formatTime(start)} - ${formatTime(end)}`;
                                    }
                                }
                            }
                        }
                    }
                });
            }

                const breakRow = document.getElementById('bulkShiftTableBreakTimesRow');
                const shortageRow = document.getElementById('bulkShiftTableShortageHoursRow');

                });
                shortageRow.innerHTML = shortageRowHtml;

                document.getElementById('bulkShiftMonthYear').textContent = `${year}年 ${month + 1}月`;

            function renderWishChart() {
                const canvas = document.getElementById('shiftWishChart');
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                if (shiftWishChartInstance) {
                    shiftWishChartInstance.destroy();
                }

                // フィルター適用
                let filteredSubmissions = wishSubmissions;
                const employeeFilter = document.getElementById('wishEmployeeFilter')?.value;
                const statusFilter = document.getElementById('wishStatusFilter')?.value;

                if (employeeFilter) {
                    filteredSubmissions = filteredSubmissions.filter(s => s.user_id == employeeFilter);
                }
                if (statusFilter) {
                    filteredSubmissions = filteredSubmissions.filter(s => s.status === statusFilter);
                }

                if (filteredSubmissions.length === 0) {
                    ctx.font = '16px Inter, sans-serif';
                    ctx.fillStyle = '#64748b';
                    ctx.textAlign = 'center';
                    ctx.fillText('この日のシフト希望はありません', canvas.width / 2, 50);
                    return;
                }

                // データを準備
                const sortedSubmissions = filteredSubmissions
                    .filter(s => s.start_time && s.end_time)
                    .sort((a, b) => {
                        if (a.start_time !== b.start_time) {
                            return a.start_time.localeCompare(b.start_time);
                        }
                        return a.end_time.localeCompare(b.end_time);
                    });

                const yLabels = [...new Set(sortedSubmissions.map(s => s.user_name))];
                const chartData = sortedSubmissions.map(submission => {
                    const startTime = parseTimeToDate(submission.start_time, wishDisplayDate);
                    const endTime = parseTimeToDate(submission.end_time, wishDisplayDate);
                    
                    if (!startTime || !endTime) return null;

                    let bgColor;
                    switch (submission.status) {
                        case 'approved': bgColor = 'rgba(34, 197, 94, 0.7)'; break; // green
                        case 'rejected': bgColor = 'rgba(239, 68, 68, 0.7)'; break; // red
                        default: bgColor = 'rgba(251, 191, 36, 0.7)'; break; // yellow
                    }

                    return {
                        x: [startTime.getTime(), endTime.getTime()],
                        y: submission.user_name,
                        originalSubmission: submission,
                        bgColor: bgColor
                    };
                }).filter(Boolean);

                const chartMinTime = new Date(wishDisplayDate);
                chartMinTime.setHours(9, 0, 0, 0);
                const chartMaxTime = new Date(wishDisplayDate);
                chartMaxTime.setHours(21, 0, 0, 0);

                shiftWishChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: yLabels,
                        datasets: [{
                            label: 'シフト希望',
                            data: chartData,
                            backgroundColor: chartData.map(d => d.bgColor)
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                type: 'time',
                                min: chartMinTime.getTime(),
                                max: chartMaxTime.getTime(),
                                time: {
                                    unit: 'hour',
                                    displayFormats: { hour: 'HH:mm' }
                                },
                                ticks: { stepSize: 1 }
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const raw = context.raw;
                                        const submission = raw.originalSubmission;
                                        let label = `${submission.user_name}: ${formatTime(new Date(raw.x[0]))} - ${formatTime(new Date(raw.x[1]))}`;
                                        if (submission.break_time) label += ` (休憩: ${submission.break_time}分)`;
                                        if (submission.notes) label += ` (${submission.notes})`;
                                        label += ` [${submission.status === 'approved' ? '承認済み' : submission.status === 'rejected' ? '却下' : '未承認'}]`;
                                        return label;
                                    }
                                }
                            }
                        }
                    }
                });
            }

            function renderWishSummary() {
                const summaryContent = document.getElementById('wishSummaryContent');
                if (!summaryContent) return;

                const total = wishSubmissions.length;
                const approved = wishSubmissions.filter(s => s.status === 'approved').length;
                const rejected = wishSubmissions.filter(s => s.status === 'rejected').length;
                const pending = wishSubmissions.filter(s => s.status === 'submitted').length;

                summaryContent.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="text-center">
                            <div class="text-2xl font-bold text-blue-600">${total}</div>
                            <div class="text-sm">総提出数</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold text-green-600">${approved}</div>
                            <div class="text-sm">承認済み</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold text-yellow-600">${pending}</div>
                            <div class="text-sm">未承認</div>
                        </div>
                        <div class="text-center">
                            <div class="text-2xl font-bold text-red-600">${rejected}</div>
                            <div class="text-sm">却下</div>
                        </div>
                    </div>
                `;
            }

            async function bulkUpdateWishStatus(status) {
                try {
                    // フィルター適用された提出を取得
                    let filteredSubmissions = wishSubmissions;
                    const employeeFilter = document.getElementById('wishEmployeeFilter')?.value;
                    const statusFilter = document.getElementById('wishStatusFilter')?.value;

                    if (employeeFilter) {
                        filteredSubmissions = filteredSubmissions.filter(s => s.user_id == employeeFilter);
                    }
                    if (statusFilter) {
                        filteredSubmissions = filteredSubmissions.filter(s => s.status === statusFilter);
                    }

                    // 未承認のもののみを対象とする
                    const targetSubmissions = filteredSubmissions.filter(s => s.status === 'submitted');

                    if (targetSubmissions.length === 0) {
                        alert('更新対象のシフト希望がありません。');
                        return;
                    }

                    // 一括更新
                    const updatePromises = targetSubmissions.map(submission => 
                        fetch(`${API_BASE_URL}/api/shift-submissions/review`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                submissionId: submission.id,
                                status: status,
                                reviewNotes: `一括${status === 'approved' ? '承認' : '却下'}`,
                                reviewedBy: currentUser.id
                            })
                        })
                    );

                    await Promise.all(updatePromises);
                    alert(`${targetSubmissions.length}件のシフト希望を${status === 'approved' ? '承認' : '却下'}しました。`);
                    
                    // データを再読み込み
                    loadWishData();
                } catch (error) {
                    console.error('Error updating wish status:', error);
                    alert('更新に失敗しました。');
                }
            }
            
            // --- イベントリスナー設定 ---
            updateUserInfo();
            Object.keys(navButtons).forEach(key => navButtons[key].addEventListener('click', () => switchView(key)));
            mainViews.bulkShift.addEventListener('change', handleBulkShiftChange);
            mainViews.bulkShift.addEventListener('keydown', handleBulkShiftKeyNavigation);
            mainViews.bulkShift.addEventListener('paste', handleBulkShiftPaste, true);
            document.getElementById('prevMonthBtn').addEventListener('click', () => { calendarDisplayDate.setMonth(calendarDisplayDate.getMonth() - 1); fetchDataForMonth(calendarDisplayDate); });
            document.getElementById('nextMonthBtn').addEventListener('click', () => { calendarDisplayDate.setMonth(calendarDisplayDate.getMonth() + 1); fetchDataForMonth(calendarDisplayDate); });
            document.getElementById('employeeHighlightSelect').addEventListener('change', (e) => { selectedEmployeeForHighlight = e.target.value; renderCalendar(); });
            document.getElementById('prevDayChartBtn').addEventListener('click', () => { chartDisplayDate.setDate(chartDisplayDate.getDate() - 1); document.getElementById('currentChartDate').value = formatDate(chartDisplayDate); fetchDataForMonth(chartDisplayDate); });
            document.getElementById('nextDayChartBtn').addEventListener('click', () => { chartDisplayDate.setDate(chartDisplayDate.getDate() + 1); document.getElementById('currentChartDate').value = formatDate(chartDisplayDate); fetchDataForMonth(chartDisplayDate); });
            document.getElementById('currentChartDate').addEventListener('change', (e) => { chartDisplayDate = new Date(e.target.value + "T00:00:00"); fetchDataForMonth(chartDisplayDate); });
            document.getElementById('prevMonthBulkBtn').addEventListener('click', () => { bulkViewDisplayMonth.setMonth(bulkViewDisplayMonth.getMonth() - 1); fetchDataForMonth(bulkViewDisplayMonth); });
            document.getElementById('nextMonthBulkBtn').addEventListener('click', () => { bulkViewDisplayMonth.setMonth(bulkViewDisplayMonth.getMonth() + 1); fetchDataForMonth(bulkViewDisplayMonth); });
            document.getElementById('toggleBulkShiftPeriodBtn').addEventListener('click', () => { bulkViewIsFirstHalf = !bulkViewIsFirstHalf; renderBulkShiftTable(); });
            
            shiftDetailModal.addEventListener('click', (event) => { 
                if (event.target === shiftDetailModal) {
                    shiftDetailModal.classList.add('hidden');
                }
            });
            
            // --- シフト提出関連のイベントリスナー ---
            document.getElementById('saveShiftSubmissionBtn').addEventListener('click', saveShiftSubmission);
            document.getElementById('clearShiftSubmissionBtn').addEventListener('click', () => {
                shiftSubmissions = {};
                renderShiftSubmissionCalendar();
            });

            // --- シフト希望表示関連のイベントリスナー ---
            document.getElementById('prevWishDateBtn').addEventListener('click', () => {
                wishDisplayDate.setDate(wishDisplayDate.getDate() - 1);
                document.getElementById('wishDisplayDate').value = formatDate(wishDisplayDate);
                loadWishData();
            });

            document.getElementById('nextWishDateBtn').addEventListener('click', () => {
                wishDisplayDate.setDate(wishDisplayDate.getDate() + 1);
                document.getElementById('wishDisplayDate').value = formatDate(wishDisplayDate);
                loadWishData();
            });

            document.getElementById('wishDisplayDate').addEventListener('change', (e) => {
                wishDisplayDate = new Date(e.target.value + "T00:00:00");
                loadWishData();
            });

            document.getElementById('wishEmployeeFilter').addEventListener('change', () => {
                renderWishChart();
            });

            document.getElementById('wishStatusFilter').addEventListener('change', () => {
                renderWishChart();
            });

            document.getElementById('refreshWishBtn').addEventListener('click', () => {
                loadWishData();
            });

            document.getElementById('approveAllBtn').addEventListener('click', async () => {
                if (confirm('選択された条件のシフト希望をすべて承認しますか？')) {
                    await bulkUpdateWishStatus('approved');
                }
            });

            document.getElementById('rejectAllBtn').addEventListener('click', async () => {
                if (confirm('選択された条件のシフト希望をすべて却下しますか？')) {
                    await bulkUpdateWishStatus('rejected');
                }
            });

            // シフト期間作成フォーム
            document.getElementById('shiftPeriodForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const year = parseInt(document.getElementById('periodYear').value);
                const month = parseInt(document.getElementById('periodMonth').value);
                const half = document.getElementById('periodHalf').value;
                const submissionStartDate = document.getElementById('submissionStartDate').value;
                const displayDeadline = document.getElementById('displayDeadline').value;
                const actualDeadline = document.getElementById('actualDeadline').value;

                // 期間の開始日と終了日を計算
                let startDate, endDate, name;
                if (half === 'first') {
                    startDate = `${year}-${month.toString().padStart(2, '0')}-01`;
                    endDate = `${year}-${month.toString().padStart(2, '0')}-15`;
                    name = `${year}年${month}月前半`;
                } else {
                    startDate = `${year}-${month.toString().padStart(2, '0')}-16`;
                    // 月末日を計算（月は0ベースなので、monthはそのまま使用）
                    const lastDay = new Date(year, month, 0).getDate();
                    endDate = `${year}-${month.toString().padStart(2, '0')}-${lastDay.toString().padStart(2, '0')}`;
                    name = `${year}年${month}月後半`;
                }

                console.log('Creating period:', { name, startDate, endDate, submissionStartDate, displayDeadline, actualDeadline });

                const periodData = {
                    name: name,
                    startDate: startDate,
                    endDate: endDate,
                    submissionStartDate: submissionStartDate,
                    displayDeadline: displayDeadline,
                    actualDeadline: actualDeadline,
                    createdBy: currentUser.id
                };

                if (!submissionStartDate || !displayDeadline || !actualDeadline) {
                    alert('提出開始日と締切日を入力してください。');
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/api/shift-periods`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(periodData)
                    });

                    if (!response.ok) {
                        const error = await response.text();
                        throw new Error(error);
                    }

                    alert('シフト提出期間を作成しました。');
                    e.target.reset();
                    // 現在の期間を再取得
                    await fetchActiveShiftPeriod();
                    if (currentShiftPeriod) {
                        loadSubmissionsList();
                    }
                } catch (error) {
                    console.error('Error creating shift period:', error);
                    alert(`期間の作成に失敗しました: ${error.message}`);
                }
            });

            // --- 初期表示処理 ---
            document.getElementById('currentChartDate').value = formatDate(chartDisplayDate);
            switchView('calendar');
        }
    });
    </script>
</body>
</html>
