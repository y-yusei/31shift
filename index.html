<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31shift - Next Gen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
</head>
<body class="overflow-x-hidden">
    <!-- 3D背景 -->
    <div id="threejs-container" class="fixed inset-0 z-0"></div>
    
    <!-- パーティクル背景 -->
    <div id="particles-container" class="fixed inset-0 z-10"></div>
    
    <!-- メインコンテンツ -->
    <div class="relative z-20 min-h-screen">
        <!-- ログイン画面 -->
        <div id="loginScreen" class="flex items-center justify-center min-h-screen">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-header">
                        <div class="logo-3d">
                            <div class="logo-cube">
                                <div class="face front">31</div>
                                <div class="face back">SHIFT</div>
                                <div class="face right"></div>
                                <div class="face left"></div>
                                <div class="face top"></div>
                                <div class="face bottom"></div>
                            </div>
                        </div>
                        <h1 class="login-title">31shift</h1>
                        <p class="login-subtitle">Next Generation Shift Management</p>
                    </div>
                    
                    <div class="login-form">
                        <div class="input-group">
                            <div class="input-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <input type="text" id="loginId" class="glass-input" placeholder="ユーザーID" value="manager">
                            <div class="input-glow"></div>
                        </div>
                        
                        <div class="input-group">
                            <div class="input-icon">
                                <i class="fas fa-lock"></i>
                            </div>
                            <input type="password" id="loginPassword" class="glass-input" placeholder="パスワード" value="pass123">
                            <div class="input-glow"></div>
                        </div>
                        
                        <button id="loginBtn" class="cyber-button">
                            <span class="button-text">ログイン</span>
                            <div class="button-glow"></div>
                            <div class="button-particles"></div>
                        </button>
                        
                        <div id="loginError" class="error-message"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- メインアプリケーション -->
        <div id="appContainer" class="hidden">
            <!-- フローティングナビゲーション -->
            <nav class="floating-nav">
                <div class="nav-orb">
                    <div class="orb-inner">
                        <div class="orb-core"></div>
                    </div>
                </div>
                <div class="nav-items">
                    <button class="nav-item active" data-view="calendar">
                        <div class="nav-icon">
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                        <span class="nav-label">カレンダー</span>
                        <div class="nav-glow"></div>
                    </button>
                    <button class="nav-item" data-view="dailyChart">
                        <div class="nav-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <span class="nav-label">グラフ</span>
                        <div class="nav-glow"></div>
                    </button>
                    <button class="nav-item" data-view="bulkShift">
                        <div class="nav-icon">
                            <i class="fas fa-table"></i>
                        </div>
                        <span class="nav-label">一括入力</span>
                        <div class="nav-glow"></div>
                    </button>
                </div>
            </nav>
            
            <!-- ヘッダー -->
            <header class="app-header">
                <div class="header-content">
                    <div class="header-left">
                        <div class="user-avatar">
                            <div class="avatar-ring"></div>
                            <div class="avatar-core">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                        <div class="user-info">
                            <span id="currentUserInfo" class="user-name"></span>
                            <div class="user-status">
                                <div class="status-dot"></div>
                                <span>オンライン</span>
                            </div>
                        </div>
                    </div>
                    <button id="logoutBtn" class="logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </header>
            
            <!-- メインコンテンツエリア -->
            <main class="app-main">
                <!-- カレンダービュー -->
                <div id="calendarView" class="view-container active">
                    <div class="view-header">
                        <h2 class="view-title">カレンダー</h2>
                        <div class="view-controls">
                            <div class="control-group">
                                <label class="control-label">従業員フィルター</label>
                                <select id="employeeHighlightSelect" class="cyber-select">
                                    <option value="">全員表示</option>
                                </select>
                            </div>
                            <div class="month-controls">
                                <button id="prevMonthBtn" class="control-btn">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <div class="month-display">
                                    <span id="calendarMonthYear"></span>
                                </div>
                                <button id="nextMonthBtn" class="control-btn">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="calendar-container">
                        <div class="calendar-grid">
                            <div class="calendar-header">
                                <div class="day-header">日</div>
                                <div class="day-header">月</div>
                                <div class="day-header">火</div>
                                <div class="day-header">水</div>
                                <div class="day-header">木</div>
                                <div class="day-header">金</div>
                                <div class="day-header">土</div>
                            </div>
                            <div id="calendarGrid" class="calendar-days"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 日別グラフビュー -->
                <div id="dailyChartView" class="view-container">
                    <div class="view-header">
                        <h2 class="view-title">日別グラフ</h2>
                        <div class="view-controls">
                            <div class="date-controls">
                                <button id="prevDayChartBtn" class="control-btn">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <div class="date-display">
                                    <input type="date" id="currentChartDate" class="cyber-input">
                                </div>
                                <button id="nextDayChartBtn" class="control-btn">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <div class="chart-wrapper">
                            <canvas id="dailyShiftChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- 一括入力ビュー -->
                <div id="bulkShiftView" class="view-container">
                    <div class="view-header">
                        <h2 class="view-title">一括入力</h2>
                        <div class="view-controls">
                            <div class="month-controls">
                                <button id="prevMonthBulkBtn" class="control-btn">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <div class="month-display">
                                    <span id="bulkShiftMonthYear"></span>
                                </div>
                                <button id="nextMonthBulkBtn" class="control-btn">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                            <div class="period-controls">
                                <button id="toggleBulkShiftPeriodBtn" class="cyber-button-small">
                                    前半 (1-15日)
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="table-container">
                        <div class="table-wrapper">
                            <table id="bulkShiftTable" class="cyber-table">
                                <thead>
                                    <tr id="bulkShiftTableDateHeader"></tr>
                                </thead>
                                <tbody id="bulkShiftTableBody"></tbody>
                                <tfoot>
                                    <tr id="bulkShiftTableBreakTimesRow"></tr>
                                    <tr id="bulkShiftTableShortageHoursRow"></tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- モーダル -->
        <div id="shiftDetailModal" class="modal-overlay hidden">
            <div class="modal-container">
                <div class="modal-content" id="modalContent"></div>
            </div>
        </div>
    </div>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 3D背景の初期化
        init3DBackground();
        
        // パーティクルシステムの初期化
        initParticleSystem();
        
        // アニメーションの初期化
        initAnimations();
        
        // 既存のJavaScriptコード（ログイン機能など）
        const credentials = { manager: { password: 'pass123', role: 'manager' }, user: { password: 'pass123', role: 'employee' } };
        const staticUsersForLogin = [{ id: 1, name: '管理者', role: 'manager' }];
        let currentUser = null;
        
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const loginIdInput = document.getElementById('loginId');
        const loginPasswordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginError = document.getElementById('loginError');
        
        function handleLogin() {
            const id = loginIdInput.value.toLowerCase();
            const password = loginPasswordInput.value;
            const userCredential = credentials[id];
            
            if (userCredential && userCredential.password === password) {
                loginError.textContent = '';
                
                // ログインアニメーション
                gsap.to(loginScreen, {
                    opacity: 0,
                    scale: 0.8,
                    duration: 0.5,
                    ease: "power2.inOut",
                    onComplete: () => {
                        loginScreen.classList.add('hidden');
                        appContainer.classList.remove('hidden');
                        
                        // アプリ表示アニメーション
                        gsap.from(appContainer, {
                            opacity: 0,
                            y: 50,
                            duration: 0.8,
                            ease: "power2.out"
                        });
                    }
                });
                
                currentUser = (userCredential.role === 'manager') ? staticUsersForLogin[0] : { id: 0, name: '従業員', role: 'employee_viewer' };
                initializeApp();
            } else {
                loginError.textContent = 'IDまたはパスワードが正しくありません。';
                gsap.to(loginError, {
                    opacity: 1,
                    y: 0,
                    duration: 0.3
                });
            }
        }
        
        function handleLogout() {
            gsap.to(appContainer, {
                opacity: 0,
                scale: 0.9,
                duration: 0.5,
                ease: "power2.inOut",
                onComplete: () => {
                    currentUser = null;
                    appContainer.classList.add('hidden');
                    loginScreen.classList.remove('hidden');
                    loginPasswordInput.value = '';
                    
                    gsap.from(loginScreen, {
                        opacity: 0,
                        scale: 0.8,
                        duration: 0.8,
                        ease: "power2.out"
                    });
                }
            });
        }
        
        loginBtn.addEventListener('click', handleLogin);
        logoutBtn.addEventListener('click', handleLogout);
        loginPasswordInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') handleLogin(); });
        
        // 3D背景の初期化
        function init3DBackground() {
            const container = document.getElementById('threejs-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);
            
            // ジオメトリの作成
            const geometry = new THREE.IcosahedronGeometry(2, 0);
            const material = new THREE.MeshPhongMaterial({
                color: 0x667eea,
                wireframe: true,
                transparent: true,
                opacity: 0.1
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            
            // ライトの追加
            const light = new THREE.DirectionalLight(0xffffff, 0.5);
            light.position.set(1, 1, 1);
            scene.add(light);
            
            camera.position.z = 5;
            
            // アニメーションループ
            function animate() {
                requestAnimationFrame(animate);
                mesh.rotation.x += 0.005;
                mesh.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();
            
            // リサイズ対応
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        // パーティクルシステムの初期化
        function initParticleSystem() {
            const container = document.getElementById('particles-container');
            const particles = [];
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
                particles.push(particle);
            }
        }
        
        // アニメーションの初期化
        function initAnimations() {
            // ロゴの3D回転アニメーション
            gsap.to('.logo-cube', {
                rotationY: 360,
                duration: 8,
                repeat: -1,
                ease: "none"
            });
            
            // ナビゲーションアイテムのホバーアニメーション
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('mouseenter', () => {
                    gsap.to(item, {
                        scale: 1.1,
                        duration: 0.3,
                        ease: "power2.out"
                    });
                });
                
                item.addEventListener('mouseleave', () => {
                    gsap.to(item, {
                        scale: 1,
                        duration: 0.3,
                        ease: "power2.out"
                    });
                });
            });
        }
        
        // アプリケーション初期化（既存のコードを簡略化）
        function initializeApp() {
            // 既存のアプリケーションロジックをここに統合
            console.log('アプリケーション初期化');
        }
    });
    </script>
</body>
</html>
